<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      background-color: white;
      font-family: Arial;
      text-align: center;
      margin: 20px;
    }

    .carwash {
      display: block;
      width: 500px;
      max-width: 90%;
      height: auto;
      margin: 30px auto;
      border-radius: 10px;
    }

    p {
      margin-top: 50px;
    }

    button {
      padding: 12px 14px;
      font-size: 14px;
      font-weight: bold;
      color: white;
      background-color: #1976D2;
      border: none;
      border-radius: 10px;
      cursor: pointer;

      transition:
        background-color 0.2s ease,
        transform 0.12s ease,
        box-shadow 0.2s ease;

      box-shadow:
        0 4px 12px rgba(25, 118, 210, 0.25);
    }

    button:hover {
      background-color: #1565C0;
      transform: translateY(-2px);
      box-shadow:
        0 6px 16px rgba(25, 118, 210, 0.35);
    }

    button:active {
      transform: scale(0.95);
      box-shadow:
        0 2px 8px rgba(25, 118, 210, 0.2);
    }

    @media (max-width: 600px) {
      body {
        margin: 10px;
      }

      h1 {
        font-size: 28px;
      }

      h2 {
        font-size: 22px;
      }

      h3 {
        font-size: 18px;
      }

      button {
        margin: 4px;
      }

      p {
        margin-top: 30px;
      }
    }
  </style>
</head>

<body>

  <button onclick="window.location.href='reviews.html'">
    Reviews
  </button>

  <button onclick="window.location.href='prices.html'">
    Packages & Prices
  </button>

  <h1>Abu Dhabi Car Wash</h1>

  <h3>🕒 Open 8AM - 11PM</h3>

  <img src="carawash.webp" class="carwash">

  <h2>Contact Us</h2>

  <button onclick="window.location.href='https://wa.me/971521155258'">
    WhatsApp Account
  </button>

  <button onclick="window.location.href='https://www.google.com/maps/search/?api=1&query=Abu+Dhabi,UAE'">
    Google Maps
  </button>

  <p>
    Made By <strong>Sultan Alawad</strong>, <strong>Khalifa City A</strong>
  </p>

</body>
</html>
