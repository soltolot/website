<!DOCTYPE html>
<html lang="en">
<head>
    <title>Sign Up</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; } /* Ensures identical sizing */

        body {
            font-family: Arial, sans-serif;
            background: #eef7f1;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .signup-container {
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 10px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            width: 350px;
            text-align: center;
            border: 1px solid #d9efe2;
        }

        .signup-container input {
            width: 100%;
            padding: 12px 10px;
            margin-bottom: 15px;
            border: 2px solid #cfe3d8; /* Matched to Login thickness */
            border-radius: 8px;
            font-size: 14px;
        }

        .signup-container button {
            width: 100%;
            padding: 12px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            /* Added smooth transitions */
            transition: background 0.25s, transform 0.15s, box-shadow 0.25s;
            box-shadow: 0 4px 12px rgba(40, 167, 69, 0.2);
        }

        .signup-container button:hover {
            background: #1e7e34;
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(40, 167, 69, 0.3);
        }

        /* Added "Pressed Down" effect */
        .signup-container button:active {
            transform: translateY(0px);
            box-shadow: 0 3px 10px rgba(40, 167, 69, 0.2);
        }

        .status { margin-top: 15px; color: #b00020; min-height: 20px; }
    </style>
</head>
<body>
    <div class="signup-container">
        <h2>Create Account</h2>
        <input id="username" placeholder="Username">
        <input id="password" type="password" placeholder="Password">
        <button onclick="signupUser()">Sign Up</button>
        <p class="status" id="status"></p>
    </div>

    <script>
        const SUPABASE_URL = "https://uhkoictzfseglnxbtdkw.supabase.co";
        const SUPABASE_KEY = "sb_publishable_-PUjgfccR3jtZcLLIyVz0w_ZL8966QQ";
        const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function signupUser() {
            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value.trim();
            const status = document.getElementById("status");

            if (!username || !password) {
                status.innerText = "Fields cannot be empty.";
                return;
            }

            // Step 1: Check if username exists
            const { data: existing } = await client
                .from("Users-and-passwords")
                .select("username")
                .eq("username", username);

            if (existing && existing.length > 0) {
                status.innerText = "Username already exists.";
                return;
            }

            // Step 2: Insert with timestamp
            const { error } = await client
                .from("Users-and-passwords")
                .insert([{ 
                    username: username, 
                    password: password, 
                    created_at: new Date().toISOString() 
                }]);

            if (error) {
                status.innerText = "Error: " + error.message;
            } else {
                status.innerText = "Success! Redirecting...";
                setTimeout(() => { window.location.href = "aboutme.html"; }, 900);
            }
        }
    </script>
</body>
</html>
