<!DOCTYPE html>
<html lang="en">
<head>
    <title>Sign Up</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #eef7f1;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .signup-container {
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 10px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            width: 350px;
            text-align: center;
            border: 1px solid #d9efe2;
        }

        .signup-container h2 {
            margin-bottom: 25px;
            color: #2f2f2f;
        }

        .signup-container input {
            width: 100%;
            padding: 12px 10px;
            margin-bottom: 15px;
            border: 1px solid #cfe3d8;
            border-radius: 6px;
            font-size: 14px;
            background: #ffffff;
        }

        .signup-container input:focus {
            outline: none;
            border-color: #28a745;
            box-shadow: 0 0 0 2px rgba(40, 167, 69, 0.12);
        }

        .signup-container button {
            width: 100%;
            padding: 12px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        .signup-container button:hover {
            background: #1e7e34;
        }

        .status {
            margin-top: 15px;
            color: #b00020;
            font-size: 14px;
            min-height: 20px;
        }

        .login-text {
            margin-top: 20px;
            font-size: 13px;
            color: #555;
        }

        .login-text a {
            color: #28a745;
            text-decoration: none;
        }

        .login-text a:hover {
            text-decoration: underline;
        }
</style>
</head>

<body>
    <div class="signup-container">
        <h2>Create Account</h2>
        <input id="username" placeholder="Username">
        <input id="password" type="password" placeholder="Password">
        <button onclick="signupUser()">Sign Up</button>
        <p class="status" id="status"></p>
        <p class="login-text">Already have an account? <a href="login.html">Log in!</a></p>
    </div>

<script>
        const SUPABASE_URL = "https://uhkoictzfseglnxbtdkw.supabase.co";
        const SUPABASE_KEY = "sb_publishable_-PUjgfccR3jtZcLLIyVz0w_ZL8966QQ";
        const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function signupUser() {
            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value.trim();
            const status = document.getElementById("status");

            if (!username || !password) {
                status.innerText = "Please enter both fields.";
                return;
            }

            status.innerText = "Creating account...";

            const { data: existing, error: checkError } = await client
                .from("Users-and-passwords")
                .select("id")
                .eq("username", username)
                .limit(1);

            if (checkError) {
                status.innerText = "Error: " + checkError.message;
                return;
            }

            if (existing.length > 0) {
                status.innerText = "Username already exists.";
                return;
            }

            const { data, error } = await client
                .from("Users-and-passwords")
                .insert([{ 
                    username: username, 
                    password: password, 
                    created_at: new Date().toISOString() 
                }]);

            if (error) {
                status.innerText = "Error: " + error.message;
            } else {
                status.innerText = "Account created! Redirecting to website...";
                setTimeout(() => {
                    window.location.href = "aboutme.html";
                }, 1200);
            }
        }
</script>
</body>
</html>
