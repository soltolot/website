<!DOCTYPE html>
<html lang="en">
<head>
    <title>Sign Up</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; }

        body {
            font-family: Arial, sans-serif;
            background: #eef7f1;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

.signup-container {
            background: #fff;
            padding: 40px 30px; 
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            width: 350px;
            text-align: center;
        }

        .signup-container input {
            width: 100%;
            padding: 12px 10px;
            margin-bottom: 15px;
            /* OFF STATE: Polished Light Green (No blue tint) */
            border: 2px solid #e0eedd; 
            border-radius: 8px;
            font-size: 14px;
            background: #f9fff8; /* Very clean green-white */
            transition: all 0.2s ease;
            outline: none; 
        }

        .signup-container input:focus {
            /* FOCUS STATE: Polished Darker Green */
            border: 2px solid #1e7e34; 
            box-shadow: 0 0 8px rgba(30, 126, 52, 0.15);
            background: #ffffff;
        }        
        .signup-container button {
            width: 100%;
            padding: 12px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.25s, transform 0.15s, box-shadow 0.25s;
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(40, 167, 69, 0.3);
        }

        .signup-container button:hover {
            background: #1e7e34;
        }

        .signup-container button:active {
            transform: translateY(0px);
            box-shadow: 0 3px 10px rgba(40, 167, 69, 0.2);
        }

        .login-text {
            margin-top: 20px;
            font-size: 13px;
            color: #555;
        }

        .login-text a {
            color: #28a745;
            text-decoration: underline;

        }

        .login-text a:hover {
            color: #1e7e34;

        }

        .status { margin-top: 15px; color: #b00020; min-height: 20px; font-size: 14px;}
    </style>
</head>
<body>
    <div class="signup-container">
        <h2>Create Account</h2>
        <input id="username" placeholder="Username">
        <input id="password" type="password" placeholder="Password">
        <button onclick="signupUser()">Sign Up</button>
        <p class="status" id="status"></p>
        <p class="login-text">Already have an account? <a href="login.html">Log in!</a></p>
    </div>

    <script>
        const SUPABASE_URL = "https://uhkoictzfseglnxbtdkw.supabase.co";
        const SUPABASE_KEY = "sb_publishable_-PUjgfccR3jtZcLLIyVz0w_ZL8966QQ";
        const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function signupUser() {
            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value.trim();
            const status = document.getElementById("status");

            if (!username || !password) {
                status.innerText = "Please enter both fields.";
                return;
            }

            status.innerText = "Checking username...";

            const { data: existing } = await client
                .from("Users-and-passwords")
                .select("username")
                .eq("username", username);

            if (existing && existing.length > 0) {
                status.innerText = "Username already exists.";
                return;
            }

            const { error } = await client
                .from("Users-and-passwords")
                .insert([{ 
                    username: username, 
                    password: password, 
                    created_at: new Date().toISOString() 
                }]);

            if (error) {
                status.innerText = "Error: " + error.message;
            } else {
                status.innerText = "Account created! Redirecting...";
                setTimeout(() => { window.location.href = "aboutme.html"; }, 900);
            }
        }
    </script>
</body>
</html>
