<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SultanChat - Final Debug</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: monospace; background: #000; color: #0f0; padding: 20px; }
        #log { border: 1px solid #0f0; padding: 15px; height: 300px; background: #050505; }
        .error { color: #ff3333; font-weight: bold; }
    </style>
</head>
<body>
    <h2>SYSTEM LOGS</h2>
    <div id="log">Starting...<br></div>

    <script>
        const display = document.getElementById('log');
        function write(text, isErr = false) {
            display.innerHTML += `<div class="${isErr ? 'error' : ''}">> ${text}</div>`;
        }

        // I have pre-cleaned these for you. 
        // JUST PASTE YOUR KEY INSIDE THE QUOTES BELOW.
        const rawUrl = "https://vldkmlbfjzdrfzpeyver.supabase.co";
        const rawKey = "sb_publishable_3e7UaMtOS1nZawcvFHYGhA_-RSInVmg";

        try {
            write("Cleaning URL and Key...");
            const cleanUrl = rawUrl.trim().replace(/\/$/, ""); // Removes spaces and extra slashes
            const cleanKey = rawKey.trim();

            write("Connecting to: " + cleanUrl);
            const client = supabase.createClient(cleanUrl, cleanKey);
            write("Client Created Successfully.");

            async function checkData() {
                write("Checking 'messages' table...");
                const { data, error } = await client.from('messages').select('content');

                if (error) {
                    write("DATABASE ERROR: " + error.message, true);
                    return;
                }

                if (data && data.length > 0) {
                    write("SUCCESS! Found " + data.length + " messages.");
                    data.forEach(m => write("MSG: " + m.content));
                } else {
                    write("Connected, but table is empty. Add a row in Supabase!");
                }
            }

            checkData();
        } catch (e) {
            write("CRASH: " + e.message, true);
        }
    </script>
</body>
</html>
