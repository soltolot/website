<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SultanChat Feed</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="font-family:sans-serif; background:#0f172a; color:white; padding:20px;">

    <div style="max-width:400px; margin:auto;">
        <h2 style="color:#38bdf8">SultanChat</h2>
        <div id="chat-box" style="background:#1e293b; border:1px solid #334155; height:300px; overflow-y:auto; padding:15px; border-radius:10px;">
            Loading...
        </div>
        <p id="stat" style="font-size:10px; color:gray; margin-top:10px;">Status: Initializing</p>
    </div>

    <script>
        // Use your credentials exactly as they appeared in your dashboard
        const URL = "https://mixxalydvognourxdtj.supabase.co"; 
        const KEY = "sb_publishable_vV0deewV5046cJLsLmQyWg_cXzSaXuU";
        
        const supabaseClient = supabase.createClient(URL, KEY);

        async function getMessages() {
            const box = document.getElementById("chat-box");
            const stat = document.getElementById("stat");

            // Added a 'cache' breaker to force the fetch past Chromebook filters
            const { data, error } = await supabaseClient
                .from("messages")
                .select("content");

            if (error) {
                stat.innerText = "Fetch Failed: " + error.message;
                stat.style.color = "red";
                return;
            }

            stat.innerText = "Status: Connected";
            stat.style.color = "lime";
            box.innerHTML = "";

            if (data && data.length > 0) {
                data.forEach(row => {
                    const d = document.createElement("div");
                    d.style.cssText = "background:#38bdf8; color:#0f172a; padding:8px; margin-bottom:8px; border-radius:5px;";
                    d.textContent = row.content;
                    box.appendChild(d);
                });
            } else {
                box.innerText = "No messages found.";
            }
        }

        getMessages();
        // Refresh every 5 seconds to keep the connection alive
        setInterval(getMessages, 5000);
    </script>
</body>
</html>
