<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SultanChat</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; margin: 0; padding: 20px; }
        .container { max-width: 420px; margin: auto; background: #1e1e1e; padding: 20px; border-radius: 12px; border: 1px solid #333; }
        #chat { height: 300px; overflow-y: auto; background: #111; padding: 15px; border-radius: 10px; border: 1px solid #444; margin-bottom: 10px; }
        .msg { background: #0077FF; padding: 10px; border-radius: 8px; margin-bottom: 8px; word-break: break-word; }
        .status { margin: 10px 0; font-family: monospace; font-size: 13px; padding: 8px; border-radius: 6px; }
        .error-box { background: #330000; color: #ff8888; padding: 12px; border-radius: 8px; font-size: 14px; margin-top: 10px; white-space: pre-wrap; }
    </style>
</head>
<body>
    <div class="container">
        <h2 style="color:#0077FF;">SultanChat</h2>
        <div id="chat">Loading messages...</div>
        <div id="status" class="status">Connecting...</div>
        <div id="error" class="error-box" style="display:none;"></div>
    </div>

    <script>
        const URL = "https://vldkmlbfjzdrfzpeyver.supabase.co";
        const KEY = "sb_publishable_3e7UaMtOS1nZawcvFHYGhA_-RSInVmg";
       
        const client = supabase.createClient(URL, KEY);

        function showError(msg) {
            const errorDiv = document.getElementById("error");
            errorDiv.style.display = "block";
            errorDiv.textContent = msg;
        }

        async function load() {
            const display = document.getElementById("chat");
            const status = document.getElementById("status");
            
            status.style.background = "#333";
            status.style.color = "#ffff00";
            status.textContent = "Fetching messages from Supabase...";

            try {
                const { data, error } = await client
                    .from("messages")
                    .select("*")
                    .order('id', { ascending: true });

                if (error) throw error;

                status.style.background = "#003300";
                status.style.color = "#00ff00";
                status.textContent = `● ONLINE - ${data.length} messages`;

                display.innerHTML = "";
                if (data.length === 0) {
                    display.innerHTML = '<div style="color:#777; text-align:center; padding:80px 20px;">No messages yet.</div>';
                } else {
                    data.forEach(m => {
                        const div = document.createElement("div");
                        div.className = "msg";
                        div.textContent = m.content || JSON.stringify(m);
                        display.appendChild(div);
                    });
                }
                display.scrollTop = display.scrollHeight;

            } catch (err) {
                console.error(err);
                status.style.background = "#330000";
                status.style.color = "#ff6666";
                status.textContent = "FAILED TO CONNECT";

                let errorText = err.message || err;
                if (err.code) errorText += `\nCode: ${err.code}`;
                if (err.details) errorText += `\nDetails: ${err.details}`;
                
                showError("ERROR:\n" + errorText);
            }
        }

        // Realtime
        client.channel('room1')
            .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, load)
            .subscribe();

        load();
    </script>
</body>
</html>
