<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SultanChat - Live Feed</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #0f172a; 
            color: #f1f5f9; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .container { 
            background: #1e293b; 
            padding: 25px; 
            border-radius: 16px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.3); 
            width: 100%; 
            max-width: 400px; 
            border: 1px solid #334155;
        }
        h2 { 
            margin: 0 0 15px 0; 
            color: #38bdf8; 
            text-align: center; 
            font-size: 24px;
        }
        #chat-box { 
            background: #0f172a; 
            border: 1px solid #334155; 
            border-radius: 12px; 
            height: 350px; 
            overflow-y: auto; 
            padding: 15px; 
            display: flex; 
            flex-direction: column;
            gap: 10px;
        }
        .msg { 
            background: #38bdf8; 
            color: #0f172a; 
            padding: 10px 14px; 
            border-radius: 12px 12px 12px 0; 
            font-size: 14px; 
            line-height: 1.4; 
            max-width: 85%;
            word-wrap: break-word;
            font-weight: 500;
        }
        .status { 
            font-size: 11px; 
            color: #94a3b8; 
            margin-top: 15px; 
            text-align: center; 
            font-family: monospace;
        }
        #error-log {
            color: #ef4444;
            font-size: 12px;
            margin-top: 10px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>SultanChat</h2>
        <div id="chat-box">Initializing connection...</div>
        <div id="error-log"></div>
        <div id="status" class="status">Connecting to Supabase...</div>
    </div>

    <script>
        // YOUR SPECIFIC CREDENTIALS
        const SB_URL = "https://mixxalydvognourxdtj.supabase.co"; 
        const SB_KEY = "sb_publishable_vV0deewV5046cJLsLmQyWg_cXzSaXuU";
        
        // Initialize the client
        const _supabase = supabase.createClient(SB_URL, SB_KEY);

        async function fetchMessages() {
            const chatBox = document.getElementById("chat-box");
            const statusLabel = document.getElementById("status");
            const errorLog = document.getElementById("error-log");

            try {
                // Fetching all rows from 'messages' table
                const { data, error, status } = await _supabase
                    .from("messages")
                    .select("content");

                if (error) {
                    chatBox.innerHTML = `<div style="color:#ef4444;text-align:center;margin-top:100px;">Connection Issue</div>`;
                    errorLog.innerText = "Error: " + error.message + " (" + error.code + ")";
                    return;
                }

                statusLabel.innerText = "● LIVE (" + status + " OK)";
                statusLabel.style.color = "#22c55e";
                errorLog.innerText = "";

                if (data && data.length > 0) {
                    chatBox.innerHTML = ""; // Clear loader
                    data.forEach(row => {
                        if (row.content) {
                            const div = document.createElement("div");
                            div.className = "msg";
                            div.textContent = row.content;
                            chatBox.appendChild(div);
                        }
                    });
                    // Auto-scroll to latest message
                    chatBox.scrollTop = chatBox.scrollHeight;
                } else {
                    chatBox.innerHTML = '<div style="color:#64748b;text-align:center;margin-top:120px;">No messages in database yet.</div>';
                }
            } catch (err) {
                errorLog.innerText = "Critical Script Error: " + err.message;
            }
        }

        // 1. Initial Load
        fetchMessages();

        // 2. Realtime Subscription (Listen for new inserts)
        _supabase
            .channel('public-chat')
            .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, (payload) => {
                console.log('New message received!', payload);
                fetchMessages(); // Refresh list when new data arrives
            })
            .subscribe();

        // 3. Fallback: Refresh every 10 seconds in case Realtime is blocked by your network
        setInterval(fetchMessages, 10000);
    </script>
</body>
</html>
