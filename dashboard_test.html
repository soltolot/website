<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SultanChat - Final Attempt</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; background: #f57c00; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: white; padding: 20px; border-radius: 20px; width: 300px; box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
        h2 { text-align: center; color: #e65100; margin-top: 0; }
        #feed { background: #fff3e0; height: 250px; overflow-y: auto; padding: 10px; border-radius: 10px; border: 1px solid #ffe0b2; }
        .msg { background: #ffcc80; padding: 8px; margin-bottom: 8px; border-radius: 8px; font-size: 14px; color: #5d4037; }
        .st { font-size: 10px; text-align: center; margin-top: 10px; color: #ef6c00; font-weight: bold; }
    </style>
</head>
<body>

    <div class="box">
        <h2>SultanChat</h2>
        <div id="feed">Checking Connection...</div>
        <div id="st" class="st">STARTING...</div>
    </div>

    <script>
        // Use a try-block to catch the "immediate" crash
        try {
            const URL = "https://vldkmlbfjzdrfzpeyver.supabase.co"; 
            const KEY = "sb_publishable_3e7UaMtOS1nZawcvFHYGhA_-RSInVmg";
            
            // Check if the library even loaded
            if (typeof supabase === 'undefined') {
                alert("CRITICAL ERROR: The Supabase library is blocked by your network/Chromebook. Try using a phone hotspot.");
            }

            const client = supabase.createClient(URL, KEY);

            async function getData() {
                const feed = document.getElementById('feed');
                const st = document.getElementById('st');

                const { data, error } = await client.from('message').select('message');

                if (error) {
                    st.innerText = "DB ERROR: " + error.message;
                    return;
                }

                st.innerText = "● LIVE";
                if (data && data.length > 0) {
                    feed.innerHTML = "";
                    data.forEach(r => {
                        const d = document.createElement('div');
                        d.className = "msg";
                        d.textContent = r.message;
                        feed.appendChild(d);
                    });
                    feed.scrollTop = feed.scrollHeight;
                } else {
                    feed.innerHTML = "No messages found.";
                }
            }

            getData();
            setInterval(getData, 3000);

        } catch (e) {
            alert("Script Crash: " + e.message);
        }
    </script>
</body>
</html>
