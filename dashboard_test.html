<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SultanChat - Fixed</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: linear-gradient(135deg, #ff9d42 0%, #f57c00 100%); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .chat-container { 
            background: white; 
            padding: 20px; 
            border-radius: 20px; 
            width: 320px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        h2 { text-align: center; color: #e65100; margin: 0 0 15px 0; }
        #log { 
            background: #fff8f0; 
            height: 300px; 
            overflow-y: auto; 
            padding: 10px; 
            border-radius: 12px; 
            display: flex; 
            flex-direction: column; 
            gap: 8px;
            border: 1px solid #ffe0b2;
        }
        .bubble { 
            background: #ffcc80; 
            color: #5d4037; 
            padding: 8px 12px; 
            border-radius: 12px 12px 12px 4px; 
            font-size: 14px; 
            font-weight: 500;
            align-self: flex-start;
        }
        .status { font-size: 9px; color: #ffa726; text-align: center; margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="chat-container">
        <h2>SultanChat</h2>
        <div id="log">Waking up database...</div>
        <div id="status" class="status">SYNCING...</div>
    </div>

    <script>
        // These are your verified working credentials
        const URL = "https://vldkmlbfjzdrfzpeyver.supabase.co"; 
        const KEY = "sb_publishable_3e7UaMtOS1nZawcvFHYGhA_-RSInVmg";
        const client = supabase.createClient(URL, KEY);

        async function updateFeed() {
            const display = document.getElementById('log');
            const status = document.getElementById('status');

            // We use a simple fetch. No "Channels" or "Subscriptions" to avoid blocks.
            const { data, error } = await client
                .from('message')
                .select('message');

            if (error) {
                status.innerText = "OFFLINE: " + error.message;
                return;
            }

            status.innerText = "● LIVE FEED ACTIVE";
            
            if (data && data.length > 0) {
                display.innerHTML = ""; // Clear "Loading"
                data.forEach(row => {
                    if (row.message) {
                        const div = document.createElement('div');
                        div.className = "bubble";
                        div.textContent = row.message;
                        display.appendChild(div);
                    }
                });
                display.scrollTop = display.scrollHeight;
            } else {
                display.innerHTML = '<div style="text-align:center;margin-top:120px;color:#ccbaaa;">No messages.</div>';
            }
        }

        // Run immediately
        updateFeed();

        // Instead of "Realtime" (which hangs), we pulse every 2 seconds
        setInterval(updateFeed, 2000);
    </script>
</body>
</html>
