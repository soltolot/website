<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SultanChat</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { 
            font-family: sans-serif; 
            background: #121212; 
            color: white; 
            margin: 0; 
            padding: 20px; 
        }
        .container { 
            max-width: 420px; 
            margin: auto; 
            background: #1e1e1e; 
            padding: 25px; 
            border-radius: 15px; 
            border: 1px solid #333; 
        }
        #chat { 
            height: 380px; 
            overflow-y: auto; 
            background: #111; 
            padding: 15px; 
            border-radius: 10px; 
            border: 1px solid #444; 
            margin-bottom: 15px; 
        }
        .msg { 
            background: #0077FF; 
            color: white; 
            padding: 12px; 
            border-radius: 10px; 
            margin-bottom: 10px; 
            word-break: break-word; 
        }
        .status { 
            padding: 12px; 
            background: #003300; 
            color: #00ff00; 
            border-radius: 8px; 
            text-align: center; 
            font-family: monospace; 
        }
        #send-area {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }
        #message-input {
            flex: 1;
            padding: 12px;
            background: #333;
            border: none;
            border-radius: 8px;
            color: white;
        }
        #send-btn {
            padding: 0 24px;
            background: #0077FF;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2 style="margin-top:0; color:#0077FF; text-align:center;">SultanChat</h2>
        <div id="chat">Loading messages...</div>
        <div id="status" class="status">Connecting...</div>
        
        <!-- Send Area -->
        <div id="send-area">
            <input type="text" id="message-input" placeholder="Type your message..." />
            <button id="send-btn">Send</button>
        </div>
    </div>

    <script>
        const client = supabase.createClient(
            "https://vldkmlbfjzdrfzpeyver.supabase.co",
            "sb_publishable_3e7UaMtOS1nZawcvFHYGhA_-RSInVmg"
        );

        async function loadMessages() {
            const chat = document.getElementById("chat");
            const status = document.getElementById("status");

            try {
                const { data, error } = await client
                    .from("message")
                    .select("message")
                    .order('id', { ascending: true });

                if (error) throw error;

                status.textContent = `● ONLINE - ${data.length} messages`;

                chat.innerHTML = "";
                if (data.length === 0) {
                    chat.innerHTML = `<div style="color:#777; text-align:center; padding:100px 20px;">No messages yet.</div>`;
                } else {
                    data.forEach(item => {
                        const div = document.createElement("div");
                        div.className = "msg";
                        div.textContent = item.message;
                        chat.appendChild(div);
                    });
                    chat.scrollTop = chat.scrollHeight;
                }
            } catch (err) {
                status.style.background = "#330000";
                status.style.color = "#ff6666";
                status.textContent = "Error loading messages";
            }
        }

        // Send Message Function
        async function sendMessage() {
            const input = document.getElementById("message-input");
            const text = input.value.trim();

            if (!text) return;

            const sendBtn = document.getElementById("send-btn");
            sendBtn.disabled = true;
            sendBtn.textContent = "Sending...";

            try {
                const { error } = await client
                    .from("message")
                    .insert({ message: text });

                if (error) throw error;

                input.value = "";           // Clear input
                // No need to call loadMessages() because realtime will handle it

            } catch (err) {
                alert("Failed to send message: " + err.message);
            } finally {
                sendBtn.disabled = false;
                sendBtn.textContent = "Send";
            }
        }

        // Real-time listener (All changes)
        client.channel('room1')
            .on('postgres_changes', { 
                event: '*', 
                schema: 'public', 
                table: 'message' 
            }, loadMessages)
            .subscribe();

        // Event Listeners
        document.getElementById("send-btn").addEventListener("click", sendMessage);

        // Allow pressing Enter to send
        document.getElementById("message-input").addEventListener("keypress", (e) => {
            if (e.key === "Enter") sendMessage();
        });

        // Initial load
        loadMessages();
    </script>
</body>
</html>
