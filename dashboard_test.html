<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SultanChat - Fixed Project</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="font-family:sans-serif; background:#0f172a; color:white; padding:20px;">

    <div style="max-width:400px; margin:auto; text-align:center;">
        <h2 style="color:#38bdf8">SultanChat (Working Project)</h2>
        <div id="box" style="background:#1e293b; height:300px; overflow-y:auto; padding:15px; border-radius:10px; text-align:left; border:1px solid #334155;">
            Loading...
        </div>
        <p id="st" style="font-size:11px; color:gray; margin-top:10px;">Checking connection...</p>
    </div>

    <script>
        // BACK TO THE URL THAT WORKS ON YOUR NETWORK
        const URL = "https://uhkoictzfseglnxbtdkw.supabase.co";
        const KEY = "sb_publishable_-PUjgfccR3jtZcLLIyVz0w_ZL8966QQ";
        const client = supabase.createClient(URL, KEY);

        async function load() {
            const { data, error } = await client.from('messages').select('content');
            const box = document.getElementById("box");
            const st = document.getElementById("st");

            if (error) {
                st.innerText = "Error: " + error.message;
                st.style.color = "red";
                return;
            }

            st.innerText = "● Connected to uhko project";
            st.style.color = "lime";
            box.innerHTML = "";

            if (data && data.length > 0) {
                data.forEach(row => {
                    const d = document.createElement("div");
                    d.style.cssText = "background:#38bdf8; color:#0f172a; padding:8px; margin-bottom:8px; border-radius:5px;";
                    d.textContent = row.content;
                    box.appendChild(d);
                });
            } else {
                box.innerText = "Connected, but no messages yet.";
            }
        }

        load();
        setInterval(load, 5000);
    </script>
</body>
</html>
