<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SultanChat - Live</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; background: #eaf3ff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); width: 380px; }
        #chat { background: #f9f9f9; border: 1px solid #ddd; border-radius: 8px; height: 300px; overflow-y: auto; padding: 15px; margin-top: 10px; }
        .msg { background: #0077FF; color: white; padding: 8px 12px; border-radius: 10px; margin-bottom: 8px; font-size: 14px; width: fit-content; }
        .status { font-size: 11px; color: #888; margin-top: 8px; text-align: center; }
    </style>
</head>
<body>

    <div class="container">
        <h2 style="margin:0; color:#0077FF; text-align:center;">SultanChat</h2>
        <div id="chat">Loading...</div>
        <div id="status" class="status">Connecting...</div>
    </div>

    <script>
        // Using your working credentials
        const URL = "https://uhkoictzfseglnxbtdkw.supabase.co";
        const KEY = "sb_publishable_-PUjgfccR3jtZcLLIyVz0w_ZL8966QQ";
        const client = supabase.createClient(URL, KEY);

        async function syncChat() {
            const display = document.getElementById("chat");
            const status = document.getElementById("status");

            // Explicitly selecting from 'messages'
            const { data, error } = await client
                .from("messages")
                .select("content");

            if (error) {
                status.innerHTML = `<span style="color:red">Error: ${error.message}</span>`;
                return;
            }

            status.innerText = "● Connected to Public Schema";
            display.innerHTML = "";

            if (data && data.length > 0) {
                data.forEach(m => {
                    const div = document.createElement("div");
                    div.className = "msg";
                    div.textContent = m.content;
                    display.appendChild(div);
                });
                display.scrollTop = display.scrollHeight;
            } else {
                display.innerHTML = '<div style="color:#bbb; text-align:center; margin-top:100px;">Waiting for messages...</div>';
            }
        }

        // Realtime updates
        client.channel('chat-updates').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, () => {
            syncChat();
        }).subscribe();

        syncChat();
    </script>
</body>
</html>
