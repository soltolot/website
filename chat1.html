<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SultanChat - Live Feed</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eaf3ff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .chat-container {
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            width: 400px;
            text-align: center;
        }

        #messages-box {
            background: #fafafa;
            border: 2px solid #d1e3ff;
            border-radius: 8px;
            height: 300px;
            overflow-y: auto;
            margin-top: 15px;
            padding: 10px;
            text-align: left;
        }

        .message-item {
            background: #e7f3ff;
            padding: 8px 12px;
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 14px;
            color: #333;
            border-left: 4px solid #0077FF;
        }

        .status-dot {
            font-size: 12px;
            color: #555;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <h2>SultanChat</h2>
        <div id="status" class="status-dot">Connecting to stream...</div>
        
        <div id="messages-box">
            <div style="color: #999; text-align: center; margin-top: 100px;">Loading messages...</div>
        </div>
    </div>

    <script>
        // USING YOUR WORKING PROJECT CREDENTIALS
        const SUPABASE_URL = "https://uhkoictzfseglnxbtdkw.supabase.co";
        const SUPABASE_KEY = "sb_publishable_-PUjgfccR3jtZcLLIyVz0w_ZL8966QQ";
        const _client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function loadMessages() {
            const status = document.getElementById("status");
            const box = document.getElementById("messages-box");

            // 1. Fetch from the 'messages' table
            const { data, error } = await _client
                .from("messages")
                .select("content");

            if (error) {
                status.style.color = "red";
                status.innerText = "Error: " + error.message;
                return;
            }

            status.style.color = "green";
            status.innerText = "● Live Connection Active";
            box.innerHTML = "";

            if (data && data.length > 0) {
                data.forEach(msg => {
                    if (msg.content) {
                        const div = document.createElement("div");
                        div.className = "message-item";
                        div.textContent = msg.content;
                        box.appendChild(div);
                    }
                });
                // Auto-scroll to the bottom
                box.scrollTop = box.scrollHeight;
            } else {
                box.innerHTML = '<div style="color:#999; text-align:center; margin-top:100px;">No messages yet.</div>';
            }
        }

        // 2. Listen for new messages in real-time
        _client
            .channel('public:messages')
            .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, (payload) => {
                // When a new message is added, just reload the list
                loadMessages();
            })
            .subscribe();

        // Initial load
        loadMessages();
    </script>
</body>
</html>
