<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SultanChat - Debug</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; background: #eaf3ff; padding: 20px; }
        .container { background: #fff; padding: 20px; border-radius: 12px; max-width: 400px; margin: auto; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        #chat { background: #f4f4f4; border: 1px solid #ddd; height: 300px; overflow-y: auto; padding: 10px; margin-top: 10px; border-radius: 8px; }
        .msg { background: #0077FF; color: white; padding: 8px; border-radius: 8px; margin-bottom: 5px; font-size: 14px; }
        .debug-log { font-size: 10px; color: #666; margin-top: 10px; border-top: 1px solid #eee; padding-top: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="text-align:center; color:#0077FF;">SultanChat</h2>
    <div id="chat">Status: Initializing...</div>
    <div class="debug-log" id="debug">Log: </div>
</div>

<script>
    const debug = document.getElementById('debug');
    const display = document.getElementById('chat');

    function log(msg) {
        debug.innerHTML += msg + " > ";
        console.log(msg);
    }

    // credentials from your working file
    const URL = "https://uhkoictzfseglnxbtdkw.supabase.co";
    const KEY = "sb_publishable_-PUjgfccR3jtZcLLIyVz0w_ZL8966QQ";

    try {
        log("Setting up client");
        const client = supabase.createClient(URL, KEY);
        
        async function start() {
            log("Fetching data");
            const { data, error } = await client.from('messages').select('content');

            if (error) {
                log("Error found");
                display.innerHTML = `<span style="color:red">DB Error: ${error.message}</span>`;
                return;
            }

            log("Success");
            display.innerHTML = "";
            if (data && data.length > 0) {
                data.forEach(m => {
                    const d = document.createElement('div');
                    d.className = "msg";
                    d.textContent = m.content;
                    display.appendChild(d);
                });
            } else {
                display.innerText = "Connected! No messages found in table.";
            }
        }

        start();
    } catch (e) {
        log("Crash");
        display.innerText = "Script Crash: " + e.message;
    }
</script>

</body>
</html>
