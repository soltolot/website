<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SultanChat - Mixx Feed</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: #1e1e1e; padding: 25px; border-radius: 15px; width: 380px; border: 1px solid #333; text-align: center; }
        #chat { background: #111; border: 1px solid #444; height: 300px; overflow-y: auto; padding: 15px; margin-top: 10px; border-radius: 10px; text-align: left; }
        .msg { background: #0077FF; color: white; padding: 10px; border-radius: 10px; margin-bottom: 10px; font-size: 14px; }
        .status { font-size: 11px; color: #888; margin-top: 10px; font-family: monospace; }
    </style>
</head>
<body>

    <div class="container">
        <h2 style="margin:0; color:#0077FF;">SultanChat</h2>
        <div id="chat">Loading messages...</div>
        <div id="status" class="status">Connecting...</div>
    </div>

    <script>
        // CLEANED CREDENTIALS
        // Note: I removed "/rest/v1/" from the URL you gave me
        const URL = "https://mixxalydvoglnourxdtj.supabase.co"; 
        const KEY = "sb_publishable_vV0deewV5046cJLsLmQyWg_cXzSaXuU";
        
        const client = supabase.createClient(URL, KEY);

        async function load() {
            const display = document.getElementById("chat");
            const status = document.getElementById("status");

            // Fetching from the table
            const { data, error } = await client
                .from("messages")
                .select("content");

            if (error) {
                status.style.color = "#ff5555";
                status.innerText = "Error: " + error.message;
                return;
            }

            status.style.color = "#00ff00";
            status.innerText = "● ONLINE (Project: mixx)";
            display.innerHTML = "";

            if (data && data.length > 0) {
                data.forEach(m => {
                    const div = document.createElement("div");
                    div.className = "msg";
                    div.textContent = m.content;
                    display.appendChild(div);
                });
                display.scrollTop = display.scrollHeight;
            } else {
                display.innerHTML = '<div style="color:#666; text-align:center; margin-top:120px;">No messages found.</div>';
            }
        }

        // Realtime listener
        client.channel('room1').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, () => {
            load();
        }).subscribe();

        load();
    </script>
</body>
</html>
