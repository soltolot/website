<!DOCTYPE html>
<html lang="en">
<head>
    <title>Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; }

        body {
            font-family: Arial, sans-serif;
            background: #eaf3ff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-container {
            background: #fff;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            width: 350px;
            text-align: center;
        }

        .login-container input {
            width: 100%;
            padding: 12px 10px;
            margin-bottom: 15px;
            border: 2px solid #d1e3ff; 
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.2s ease;
            outline: none; 
        }

        .login-container input:focus {
            border: 2px solid #0056b3; 
            box-shadow: 0 0 8px rgba(0, 86, 179, 0.2);
        }
        
        .login-container button {
            width: 100%;
            padding: 12px;
            background: #0077FF;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.25s, transform 0.15s, box-shadow 0.25s;
            box-shadow: 0 4px 12px rgba(0, 119, 255, 0.2);
        }

        .login-container button:hover {
            background: #005fcc;
            transform: translateY(-2px);
        }

        .status { margin-top: 15px; min-height: 20px; font-size: 14px; font-weight: bold;}
    </style>
</head>
<body>

    <div class="login-container">
        <h2>Login</h2>
        <input id="username" placeholder="Username">
        <input id="password" type="password" placeholder="Password">
        <button onclick="processLogin()">Login</button>
        <p class="status" id="status"></p>
        <p class="signup-text">Don't have an account? <a href="signup.html">Signup!</a></p>

    </div>

<script>
    const SUPABASE_URL = "https://vldkmlbfjzdrfzpeyver.supabase.co";
    const SUPABASE_KEY = "sb_publishable_3e7UaMtOS1nZawcvFHYGhA_-RSInVmg";
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function processLogin() {
        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value.trim();
        const status = document.getElementById("status");

        if (!username || !password) {
            status.innerText = "Please fill in all fields.";
            return;
        }

        status.style.color = "#2d3436";
        status.innerText = "Logging in...";

        const { data, error } = await client.auth.signInWithPassword({
            email: username,
            password: password,
            options: {
                expiresIn: 60 * 60 * 24 * 7 // 1 week session
            }
        });

        if (error) {
            status.style.color = "#d63031";
            status.innerText = "Error: " + error.message;
            return;
        }

        status.style.color = "#28a745";
        status.innerText = "Login successful! Redirecting...";

        setTimeout(() => {
            window.location.href = "chat.html";
        }, 1000);
    }
</script>
</body>
</html>
