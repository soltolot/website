<!DOCTYPE html>
<html lang="en">
<head>
    <title>Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; }

        body {
            font-family: Arial, sans-serif;
            background: #eaf3ff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-container {
            background: #fff;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            width: 350px;
            text-align: center;
        }

        .login-container input {
            width: 100%;
            padding: 12px 10px;
            margin-bottom: 15px;
            border: 2px solid #d1e3ff; 
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.2s ease;
            outline: none; 
        }

        .login-container input:focus {
            border: 2px solid #0056b3; 
            box-shadow: 0 0 8px rgba(0, 86, 179, 0.2);
        }
        
        .login-container button {
            width: 100%;
            padding: 12px;
            background: #0077FF;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.25s, transform 0.15s, box-shadow 0.25s;
            box-shadow: 0 4px 12px rgba(0, 119, 255, 0.2);
        }

        .login-container button:hover {
            background: #005fcc;
            transform: translateY(-2px);
        }

        .status { margin-top: 15px; min-height: 20px; font-size: 14px; font-weight: bold;}
    </style>
</head>
<body>

    <div class="login-container">
        <h2>Login</h2>
        <input id="username" placeholder="Username">
        <input id="password" type="password" placeholder="Password">
        <button onclick="processLogin()">Login</button>
        <p class="status" id="status"></p>
        <p class="signup-text">Don't have an account? <a href="signup.html">Signup!</a></p>

    </div>

<script>
    const SUPABASE_URL = "https://vldkmlbfjzdrfzpeyver.supabase.co";
    const SUPABASE_KEY = "sb_publishable_3e7UaMtOS1nZawcvFHYGhA_-RSInVmg";
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);


// ===============================
// STATE
// ===============================
let sessionChecked = false;

// ===============================
// WAIT FOR SUPABASE AUTH INIT
// ===============================
function waitForAuthInit() {
    return new Promise((resolve) => {

        const { data: listener } = client.auth.onAuthStateChange(() => {
            listener.subscription.unsubscribe();
            resolve();
        });

        // fallback (important for slow loads on GitHub Pages)
        setTimeout(resolve, 300);
    });
}

// ===============================
// SAFE SESSION CHECK
// ===============================
async function checkSessionSafe() {

    const { data: { session } } = await client.auth.getSession();

    if (session) return true;

    await new Promise(r => setTimeout(r, 400));

    const retry = await client.auth.getSession();

    if (retry.data.session) return true;

    window.location.href = "login.html";
    return false;
}

// ===============================
// AUTH LISTENER (LIVE GUARD)
// ===============================
function setupAuthListener() {

    client.auth.onAuthStateChange((event, session) => {

        if (!session) {
            window.location.href = "login.html";
        }
    });
}

// ===============================
// USER LOADER
// ===============================
async function loadUserSafe() {

    const { data: { user } } = await client.auth.getUser();

    if (!user) {
        window.location.href = "login.html";
        return;
    }

    window.displayName =
        user.user_metadata?.display_name || "Anonymous";
}

// ===============================
// PROFILE SYSTEM
// (you already had this elsewhere, but required here)
// ===============================
let myColor = localStorage.getItem("myColor") || "#FF6200";

document.documentElement.style.setProperty("--my-msg-color", myColor);

async function ensureProfile() {

    if (!window.displayName) return;

    const { data, error } = await client
        .from("profiles")
        .select("*")
        .eq("username", window.displayName);

    if (error) return;

    if (!data.length) {

        await client.from("profiles").insert({
            username: window.displayName,
            color: myColor
        });

    } else {

        const dbColor = data[0]?.color;

        if (dbColor) {
            myColor = dbColor;

            localStorage.setItem("myColor", dbColor);

            document.documentElement.style.setProperty(
                "--my-msg-color",
                dbColor
            );
        }
    }
}

// ===============================
// UPDATE COLOR
// ===============================
async function updateUserColor(newColor) {

    myColor = newColor;

    localStorage.setItem("myColor", newColor);

    document.documentElement.style.setProperty(
        "--my-msg-color",
        newColor
    );

    await client
        .from("profiles")
        .update({ color: newColor })
        .eq("username", window.displayName);

    loadMessages();
}

// ===============================
// CHAT ERROR DISPLAY
// ===============================
function showChatError(text) {

    const chat = document.getElementById("chat");

    const div = document.createElement("div");

    div.className = "msg";
    div.style.background = "#B00020";
    div.textContent = "SYSTEM: " + text;

    chat.appendChild(div);

    chat.scrollTop = chat.scrollHeight;
}

// ===============================
// LOAD MESSAGES
// ===============================
async function loadMessages() {

    const chat = document.getElementById("chat");
    const status = document.getElementById("status");

    try {

        const { data: messages, error: msgErr } =
            await client
                .from("messages")
                .select("*")
                .order("id", { ascending: true });

        if (msgErr) throw msgErr;

        const { data: profiles, error: profErr } =
            await client.from("profiles").select("*");

        if (profErr) throw profErr;

        const colors = {};
        profiles.forEach(p => {
            colors[p.username] = p.color;
        });

        status.textContent = `● ONLINE • ${messages.length}`;

        chat.innerHTML = "";

        if (!messages.length) {
            chat.innerHTML = "<div>No messages 👋</div>";
            return;
        }

        messages.forEach(m => {

            const div = document.createElement("div");
            div.className = "msg";

            if (m.username === window.displayName) {
                div.classList.add("my-msg");
            } else {
                div.style.background =
                    colors[m.username] || "#FF6200";
            }

            div.textContent = `${m.username}: ${m.message}`;
            chat.appendChild(div);
        });

        chat.scrollTop = chat.scrollHeight;

    } catch (err) {
        status.textContent = "● ERROR";
        showChatError("Failed to load messages");
    }
}

// ===============================
// SEND MESSAGE
// ===============================
async function sendMessage() {

    const input = document.getElementById("message-input");
    const text = input.value.trim();

    if (!text) return;

    const { error } = await client
        .from("messages")
        .insert({
            username: window.displayName,
            message: text
        });

    if (error) {
        showChatError("Message failed to send");
        return;
    }

    input.value = "";
}

// ===============================
// REALTIME
// ===============================
client.channel("messages-live")
.on("postgres_changes", {
    event: "INSERT",
    schema: "public",
    table: "messages"
}, () => {
    loadMessages();
})
.subscribe();

// ===============================
// AUTH BOOTSTRAP (FIXED FLOW)
// ===============================
async function initChatApp() {

    await waitForAuthInit();

    const ok = await checkSessionSafe();
    if (!ok) return;

    await loadUserSafe();

    await ensureProfile();
    await loadMessages();

    setupAuthListener();
    setupUI();
}

// ===============================
// START APP
// ===============================
(async () => {
    await initChatApp();
})();
</script>
</body>
</html>
