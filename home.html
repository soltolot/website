<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HomePage -- SultanChat</title>
    <script src="sultanchat/js/bootstrap.js" defer></script>
</head>
<body>

    <div class="home">
        <h1>SultanChat</h1>

<div class="buttons">
<button class="button" onclick="goChat()">Enter Chat</button>
<button class="button" onclick="goLogin()">Login</button>
<button class="button" onclick="goSign()">Sign up</button></div>  
<p class="system">
 🔴SultanChat is currently bring updated, and is currently broken.</p>
    </div>

    
    <style>

body {
    font-family: sans-serif;
    margin: 0;
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    background: linear-gradient(135deg, #FFF8F0, #FFEDD5);
}

/* main card */
.home {
    text-align: center;
    padding: 40px 30px;

    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;

    background: rgba(255, 255, 255, 0.6);
    backdrop-filter: blur(10px);

    border-radius: 18px;
    border: 1px solid rgba(0, 0, 0, 0.05);

    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);

    width: 320px;
}

/* title */
.home h1 {
    margin: 0;
    font-size: 32px;
    color: #E65100;
}

/* subtitle */
.home p {
    margin-top: 10px;
    margin-bottom: 25px;
    color: #444;
    font-size: 14px;
}


.send-area {
    display: flex;
    gap: 8px;
    margin-top: 10px;
}


input {
    flex: 1;
    padding: 12px;
    background: #FFF4E0;
    border: 2px solid #FFBB66;
    border-radius: 10px;
    font-size: 15px;
    outline: none;
}


.buttons {
    display: flex;
    flex-direction: row;
    gap: 10px;
}
        

.system {
    margin-top: 14px;

    font-size: 13px;
    font-weight: 600;

    color: #E65100;

    background: rgba(230, 81, 0, 0.08);

    padding: 10px 12px;

    border-radius: 10px;

    border: 1px solid rgba(230, 81, 0, 0.18);

    text-align: center;
}
/* buttons */
.button {
    padding: 12px;
    border: none;
    border-radius: 12px;

    font-weight: bold;
    cursor: pointer;

    color: white;
    background: #E65100;

    transition: 0.2s ease;
}

/* hover effect */
.button:hover {
    transform: translateY(-2px);
    background: #DC4D00;
    box-shadow: 0 10px 20px rgba(230, 81, 0, 0.25);
}

/* click feel */
.button:active {
    transform: scale(0.96);
}        
    </style>
    
    
    <script>
        
        function goChat() {
            window.location.href = "sultanchat/chat.html";
        }
        function goLogin() {
            window.location.href = "sultanchat/login.html";
        }
        function goSign() {
            window.location.href = "sultanchat/signup.html";
        }

    </script>

</body>
</html>
