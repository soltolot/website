<!DOCTYPE html>
<html>
<head>
    <title>HomePage -- SultanChat</title>
</head>
<body>

    <div class="home">
        <h1>SultanChat</h1>
        <p>real-time chat with live themes</p>

        <button class="btn" onclick="goChat()">Enter Chat</button>
        <button class="btn" onclick="goLogin()">Login</button>
        <button class="btn" onclick="goSign()">Sign up</button>
        <p class="system">🟠  Homepage update in progress. Some features may be unstable. Full systems remain online.</p>

    </div>

    
    <style>

body {
    font-family: sans-serif;
    margin: 0;
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    background: linear-gradient(135deg, #FFF8F0, #FFEDD5);
}

/* main card */
.home {
    text-align: center;
    padding: 40px 30px;

    background: rgba(255, 255, 255, 0.6);
    backdrop-filter: blur(10px);

    border-radius: 18px;
    border: 1px solid rgba(0, 0, 0, 0.05);

    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);

    width: 320px;
}

/* title */
.home h1 {
    margin: 0;
    font-size: 32px;
    color: #E65100;
}

/* subtitle */
.home p {
    margin-top: 10px;
    margin-bottom: 25px;
    color: #444;
    font-size: 14px;
}

/* button layout */
.buttons {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.system {
    margin-top: 14px;
    font-weight: 600;
    font-size: 13px;
    color: #ababab;

    background: #e65100;
    padding: 10px 12px;

    border-radius: 10px;
    border: 1px solid #FFE08A;

    text-align: center;
}
/* buttons */
.button {
    padding: 12px;
    border: none;
    border-radius: 12px;

    font-weight: bold;
    cursor: pointer;

    color: white;
    background: #E65100;

    transition: 0.2s ease;
}

/* hover effect */
.button:hover {
    transform: translateY(-2px);
    background: #DC4D00;
    box-shadow: 0 10px 20px rgba(230, 81, 0, 0.25);
}

/* click feel */
.button:active {
    transform: scale(0.96);
}        
    </style>
    
    
    <script>
        function goChat() {
            window.location.href = "chat.html";
        }
        function goLogin() {
            window.location.href = "login.html";
        }
        function goSign() {
            window.location.href = "signup.html";
        }

    </script>

</body>
</html>
