<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sandbox with Errors</title>

<style>
body {
    font-family: sans-serif;
    margin: 20px;
    background: #fff8f0;
}

textarea {
    width: 100%;
    height: 220px;
    font-family: monospace;
    font-size: 14px;
    padding: 10px;
    border: 2px solid #ffbb66;
    border-radius: 10px;
    background: #fff4e0;
    outline: none;
}

.toolbar {
    display: flex;
    gap: 10px;
    margin: 10px 0;
}

button {
    padding: 8px 12px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    background: #e65100;
    color: white;
    font-weight: bold;
}

button:hover {
    background: #d84315;
}

iframe {
    width: 100%;
    height: 260px;
    border: 2px solid #ffd0a0;
    border-radius: 10px;
    background: white;
}

#errors {
    margin-top: 10px;
    padding: 10px;
    border-radius: 10px;
    background: #1e1e1e;
    color: #ff6b6b;
    font-family: monospace;
    font-size: 13px;
    white-space: pre-wrap;
}
</style>

</head>

<body>

<h2>🧪 Sandbox + Error Console</h2>

<div class="toolbar">
    <button onclick="runCode()">▶ Run</button>
    <button onclick="clearErrors()">🧹 Clear Errors</button>
</div>

<textarea id="input">
<!DOCTYPE html>
<html>
<head>
<title>Test</title>
</head>

<body>

<h3>Hello 👋</h3>

<script>
console.log("Running...");
alert("Hi!");

throw new Error("Something broke!");
</script>

</body>
</html>
</textarea>

<iframe id="preview"></iframe>

<div id="errors">No errors yet.</div>

<script>
const input = document.getElementById("input");
const preview = document.getElementById("preview");
const errors = document.getElementById("errors");

// --------------------------------------------------
// ERROR CAPTURE SETUP INSIDE IFRAME
// --------------------------------------------------
function attachErrorHandler(doc) {
    const script = doc.createElement("script");

    script.textContent = `
        window.onerror = function(message, source, lineno, colno, error) {
            parent.postMessage({
                type: "sandbox-error",
                message,
                lineno,
                colno
            }, "*");
        };

        window.onunhandledrejection = function(event) {
            parent.postMessage({
                type: "sandbox-error",
                message: event.reason
            }, "*");
        };
    `;

    doc.head.appendChild(script);
}

// --------------------------------------------------
// RUN CODE
// --------------------------------------------------
function runCode() {
    const doc = preview.contentDocument || preview.contentWindow.document;
    doc.open();
    doc.write(input.value);
    doc.close();

    attachErrorHandler(doc);
}

// --------------------------------------------------
// RECEIVE ERRORS FROM IFRAME
// --------------------------------------------------
window.addEventListener("message", (event) => {
    if (event.data?.type === "sandbox-error") {
        errors.textContent += `\n❌ ${event.data.message} (line ${event.data.lineno || "?"})`;
    }
});

// --------------------------------------------------
function clearErrors() {
    errors.textContent = "No errors yet.";
}

// initial run
runCode();
</script>

</body>
</html>
