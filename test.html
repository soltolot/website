<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Click-to-Run Sandbox</title>

<style>
body {
    font-family: sans-serif;
    margin: 20px;
    background: #fff8f0;
}

textarea {
    width: 100%;
    height: 160px;
    font-family: monospace;
    font-size: 14px;
    padding: 10px;
    border: 2px solid #ffbb66;
    border-radius: 10px;
    outline: none;
    background: #fff4e0;
}

#preview {
    margin-top: 15px;
    padding: 15px;
    border-radius: 10px;
    border: 2px solid #ffd0a0;
    background: white;
    min-height: 120px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.08);
}

.toolbar {
    display: flex;
    gap: 10px;
    margin-bottom: 10px;
}

button {
    padding: 8px 12px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    background: #e65100;
    color: white;
    font-weight: bold;
}

button:hover {
    background: #d84315;
}
</style>

</head>

<body>

<h2>🧪 Click-to-Run Sandbox</h2>

<div class="toolbar">
    <button onclick="runCode()">▶ Run Code</button>
    <button onclick="setSafeMode()">Safe Mode</button>
    <button onclick="setHtmlMode()">HTML + JS Mode</button>
</div>

<textarea id="input">
<h3>Hello 👋</h3>
<p>Click Run to execute.</p>

<script>
alert("JS runs only when you press Run!");
</script>
</textarea>

<div id="preview"></div>

<script>
const input = document.getElementById("input");
const preview = document.getElementById("preview");

let mode = "html";

// -----------------------------
// SCRIPT EXECUTOR
// -----------------------------
function runScripts(container) {
    const scripts = container.querySelectorAll("script");

    scripts.forEach(oldScript => {
        const newScript = document.createElement("script");

        if (oldScript.src) {
            newScript.src = oldScript.src;
        } else {
            newScript.textContent = oldScript.textContent;
        }

        oldScript.remove();
        document.body.appendChild(newScript);
    });
}

// -----------------------------
// MAIN RUN FUNCTION (BUTTON)
// -----------------------------
function runCode() {
    preview.innerHTML = input.value;

    if (mode === "html") {
        runScripts(preview);
    }
}

// -----------------------------
// MODES
// -----------------------------
function setSafeMode() {
    mode = "safe";
    runCode();
}

function setHtmlMode() {
    mode = "html";
    runCode();
}

// initial render (does NOT auto-run on typing)
runCode();
</script>

</body>
</html>
