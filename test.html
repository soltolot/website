<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Full Web Sandbox</title>

<style>
body {
    font-family: sans-serif;
    margin: 20px;
    background: #fff8f0;
}

textarea {
    width: 100%;
    height: 220px;
    font-family: monospace;
    font-size: 14px;
    padding: 10px;
    border: 2px solid #ffbb66;
    border-radius: 10px;
    background: #fff4e0;
    outline: none;
}

.toolbar {
    display: flex;
    gap: 10px;
    margin: 10px 0;
}

button {
    padding: 8px 12px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    background: #e65100;
    color: white;
    font-weight: bold;
}

button:hover {
    background: #d84315;
}

iframe {
    width: 100%;
    height: 300px;
    border: 2px solid #ffd0a0;
    border-radius: 10px;
    background: white;
}
</style>

</head>

<body>

<h2>🧪 Full Web Sandbox (HTML + CSS + JS)</h2>

<div class="toolbar">
    <button onclick="runCode()">▶ Run</button>
</div>

<textarea id="input">
<!DOCTYPE html>
<html>
<head>
<title>My Test Page</title>

<style>
body {
    font-family: sans-serif;
    background: #f0f8ff;
}
h3 {
    color: red;
}
</style>
</head>

<body>

<h3>Hello 👋</h3>
<p>This is fully sandboxed.</p>

<script>
alert("JS is running inside iframe!");
</script>

</body>
</html>
</textarea>

<iframe id="preview"></iframe>

<script>
const input = document.getElementById("input");
const preview = document.getElementById("preview");

// --------------------------------------------------
// RUN FULL HTML DOCUMENT INSIDE IFRAME
// --------------------------------------------------
function runCode() {
    const doc = preview.contentDocument || preview.contentWindow.document;
    doc.open();
    doc.write(input.value);
    doc.close();
}

// initial render
runCode();
</script>

</body>
</html>
