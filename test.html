<div id="chat"></div>

<div id="status"></div>

<input id="message-input">
<button id="send-btn">Send</button>
<script>

const client = supabase.createClient(
  "https://vldkmlbfjzdrfzpeyver.supabase.co",
  "sb_publishable_3e7UaMtOS1nZawcvFHYGhA_-RSInVmg"
);

let displayName = null;

// --------------------
// AUTH CHECK
// --------------------
async function checkSession() {
  const { data } = await client.auth.getSession();
  return !!data.session;
}

// --------------------
// LOAD USER NAME
// --------------------
async function loadUser() {
  const { data } = await client.auth.getUser();
  if (!data.user) return false;

  displayName =
    data.user.user_metadata?.display_name || "Anonymous";

  return true;
}

// --------------------
// LOAD MESSAGES
// --------------------
async function loadMessages() {
  const chat = document.getElementById("chat");
  const status = document.getElementById("status");

  status.textContent = "Loading...";

  const { data, error } = await client
    .from("message")
    .select("*")
    .order("id", { ascending: true });

  if (error) {
    chat.textContent = "ERROR: " + error.message;
    return;
  }

  chat.innerHTML = "";

  data.forEach(m => {
    const div = document.createElement("div");
    div.textContent = `${m.username}: ${m.message}`;
    chat.appendChild(div);
  });

  status.textContent = `● ONLINE • ${data.length}`;
}

// --------------------
// SEND MESSAGE
// --------------------
async function sendMessage() {
  const input = document.getElementById("message-input");
  const text = input.value.trim();

  if (!text) return;

  const { error } = await client
    .from("message")
    .insert({
      username: displayName,
      message: text
    });

  if (!error) {
    input.value = "";
    loadMessages();
  }
}

// --------------------
// BOOT
// --------------------
async function boot() {
  const ok = await checkSession();
  if (!ok) {
    window.location.href = "login.html";
    return;
  }

  await loadUser();
  await loadMessages();

  document
    .getElementById("send-btn")
    .addEventListener("click", sendMessage);
}

boot();
    
</script>
