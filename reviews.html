<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      background-color: white;
      font-family: Arial;
      text-align: center;
      margin: 20px;
    }

    .car {
      width: 500px;
      max-width: 100%;
      height: auto;
      border-radius: 10px;
    }

    .small-car {
      width: 300px;
      max-width: 100%;
      height: auto;
      border-radius: 10px;
    }

    h3 {
      margin: 20px;
    }

    button {
      padding: 12px 14px;
      font-size: 14px;
      font-weight: bold;
      color: white;
      background-color: #1976D2;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      margin: 0 auto 20px;

      transition:
        background-color 0.2s ease,
        transform 0.12s ease,
        box-shadow 0.2s ease;

      box-shadow:
        0 4px 12px rgba(25, 118, 210, 0.25);
    }

    button:hover {
      background-color: #1565C0;
      transform: translateY(-2px);

      box-shadow:
        0 6px 16px rgba(25, 118, 210, 0.35);
    }

    button:active {
      transform: scale(0.95);

      box-shadow:
        0 2px 8px rgba(25, 118, 210, 0.2);
    }

    .reviews {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 30px;
      flex-wrap: wrap;
    }

    .review {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 500px;
      max-width: 100%;
    }

    @media (max-width: 600px) {
      body {
        margin: 10px;
      }

      h3 {
        margin: 10px;
        font-size: 18px;
      }

      .reviews {
        flex-direction: column;
        align-items: center;
      }

      .review {
        width: 100%;
      }

      .car {
        width: 100%;
      }

      .small-car {
        width: 300px;
        max-width: 100%;
      }
    }
  </style>
</head>

<body>

  <button onclick="window.location.href='AbuDhabi_carwash.html'">
    Back
  </button>

  <div class="reviews">

    <div class="review">
      <h3>⭐⭐⭐⭐⭐ Ahmed: "My car looked brand new!"</h3>
      <img src="car.jpeg" class="car">
    </div>

    <div class="review">
      <h3>⭐⭐⭐⭐ Abdullah: "Fast and affordable car wash."</h3>
      <img src="car1.jpeg" class="small-car">
    </div>

  </div>

</body>
</html>
