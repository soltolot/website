<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      background-color: white;
      font-family: Arial;
    }

    .car {
      border-radius: 10px;
    }

    h3 {
      margin: 20px;
    }

        button {
      padding: 12px 14px;
      font-size: 14px;
      font-weight: bold;
      color: white;
      background-color: #1976D2;
      border: none;
      border-radius: 10px;
      cursor: pointer;

      transition:
        background-color 0.2s ease,
        transform 0.12s ease,
        box-shadow 0.2s ease;

      box-shadow:
        0 4px 12px rgba(25, 118, 210, 0.25);
    }

    button:hover {
      background-color: #1565C0;
      transform: translateY(-2px);
      box-shadow:
        0 6px 16px rgba(25, 118, 210, 0.35);
    }

    button:active {
      transform: scale(0.95);
      box-shadow:
        0 2px 8px rgba(25, 118, 210, 0.2);
    }

  </style>
</head>

<body>

  <button onclick="window.location.href='AbuDhabi_carwash.html'">
    Back
  </button>
  <div class="reviews">
  <h3>⭐⭐⭐⭐⭐ Ahmed: "My car looked brand new!"</h3>

  <img src="car.jpeg" class="car" width="500">

  <h3>⭐⭐⭐⭐ Abdullah: "Fast and affordable car wash."</h3>

  <img src="car1.jpeg" class="car" width="500">
  </div>
</body>
</html>
