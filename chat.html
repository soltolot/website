<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SultanChat</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        body { 
            margin: 0; padding: 40px; 
            font-family: Arial, sans-serif; 
            background-color: #f0f0f0; 
        }
        h1 { margin-top: 0; }
        #raw-messages p { 
            background: white; 
            padding: 10px; 
            border-bottom: 1px solid #eee; 
            margin: 0;
        }
    </style>
</head>
<body>

    <main class="main-content">
        <h1>SultanChat</h1>
        <p style="margin-bottom: 30px; color: #666;">kk to my alternative to Whatsapp: SultanChat.</p>

        <div id="raw-messages">Loading messages...</div>
    </main>

<script>
    // 1. Update these with the EXACT keys from your "Settings > API" page
    const SUPABASE_URL = "https://uhkoictzfseglnxbtdkw.supabase.co";
    // PASTE YOUR NEW KEY STARTING WITH 'sb_publishable_vV0' BELOW
    const SUPABASE_KEY = "sb_publishable_vV0deewV5046cJLsLmQyWg_cXzSaXuU"; 
    
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function getHistory() {
        const { data, error } = await _supabase
            .from('messages')
            .select('content'); // Fixed: removed the 's'
            
        if (error) {
            console.error("Error:", error);
            document.getElementById('raw-messages').innerText = "Error: " + error.message;
            return;
        }

        if (data && data.length > 0) {
            document.getElementById('raw-messages').innerHTML = ''; 
            data.forEach(msg => {
                // Fixed logic: ensures we only show rows that actually have text
                if(msg.content) {
                    document.getElementById('raw-messages').innerHTML += `<p>${msg.content}</p>`;
                }
            });
        } else {
            document.getElementById('raw-messages').innerText = "Success. No messages in database yet.";
        }
    }

    // Realtime logic (stays the same, but fixed 'content' reference)
    _supabase
      .channel('chat_channel')
      .on('postgres_changes', { 
          event: 'INSERT', 
          schema: 'public', 
          table: 'messages' 
      }, (payload) => {
          if(payload.new.content) {
              document.getElementById('raw-messages').innerHTML += `<p>${payload.new.content}</p>`;
          }
      })
      .subscribe();

    getHistory();
</script>
</body>
</html>
