<script>
/* =========================
   SUPABASE CLIENT
========================= */
const client = supabase.createClient(
    "YOUR_SUPABASE_URL_HERE",
    "YOUR_SUPABASE_KEY_HERE"
);

/* =========================
   ERROR DISPLAY (SAFE)
========================= */

function showFatalError(title, details) {
    const chat = document.getElementById("chat");
    const status = document.getElementById("status");

    console.error("FATAL ERROR:", title, details);

    if (status) {
        status.style.background = "#FFE0E0";
        status.style.color = "#FF4444";
        status.textContent = "CRITICAL ENGINE BREAKDOWN";
    }

    if (chat) {
        const div = document.createElement("div");
        div.className = "msg error";
        div.style.cssText = `
            color:#FF4444;
            padding:12px;
            font-family:monospace;
            font-size:13px;
            background:#FFEAEB;
            border-radius:8px;
            border-left:4px solid #FF4444;
            white-space:pre-wrap;
            margin:8px 0;
        `;
        div.textContent = `${title}\n\n${details.trim()}`;
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
    }
}

/* =========================
   GLOBAL JS ERROR CATCHER
========================= */

window.addEventListener("error", function (event) {
    if (!event.error) return; // ignore harmless errors
    showFatalError(
        "JavaScript Runtime Error",
        `Message: ${event.message}\nFile: ${event.filename}\nLine: ${event.lineno}:${event.colno}`
    );
}, true);

window.addEventListener("unhandledrejection", function (event) {
    showFatalError(
        "Unhandled Promise Rejection",
        `Reason: ${event.reason}`
    );
});

/* =========================
   LOAD MESSAGES
========================= */

async function loadMessages() {
    const chat = document.getElementById("chat");
    const status = document.getElementById("status");

    try {
        const { data, error } = await client
            .from("message") // FIXED: real table name
            .select("*")
            .order("id", { ascending: true });

        if (error) throw error;

        status.textContent = `● ONLINE - ${data.length} messages`;
        chat.innerHTML = "";

        if (data.length === 0) {
            chat.innerHTML = `
                <div style="color:#FF8A00; text-align:center; padding:80px 20px;">
                    No messages yet 👋
                </div>
            `;
            return;
        }

        for (const item of data) {
            const div = document.createElement("div");
            div.className = "msg";
            div.textContent = item.message || item.suggestion || "(empty)";
            chat.appendChild(div);
        }

        chat.scrollTop = chat.scrollHeight;

    } catch (err) {
        showFatalError(
            "Supabase Query Failure",
            `Message: ${err.message}\nCode: ${err.code}\nDetails: ${err.details}\nHint: ${err.hint}`
        );
    }
}

/* =========================
   SEND MESSAGE
========================= */

async function sendMessage() {
    const input = document.getElementById("message-input");
    const btn = document.getElementById("send-btn");

    const text = input.value.trim();
    if (!text) return;

    btn.disabled = true;
    btn.textContent = "Sending...";

    try {
        const { error } = await client
            .from("message")
            .insert({ message: text });

        if (error) throw error;

        input.value = "";

    } catch (err) {
        showFatalError("Send Message Error", err.message);
    } finally {
        btn.disabled = false;
        btn.textContent = "Send";
    }
}

/* =========================
   SEND SUGGESTION
========================= */

async function sendSuggest() {
    const input = document.getElementById("suggest-input");
    const btn = document.getElementById("suggest-btn");

    const text = input.value.trim();
    if (!text) return;

    btn.disabled = true;
    btn.textContent = "Sending...";

    try {
        const { error } = await client
            .from("message")
            .insert({ suggestion: text });

        if (error) throw error;

        input.value = "";

    } catch (err) {
        showFatalError("Send Suggestion Error", err.message);
    } finally {
        btn.disabled = false;
        btn.textContent = "Suggest";
    }
}

/* =========================
   EVENT BINDING
========================= */

function bindUI() {
    const sendBtn = document.getElementById("send-btn");
    const msgInput = document.getElementById("message-input");
    const suggestBtn = document.getElementById("suggest-btn");
    const suggestInput = document.getElementById("suggest-input");

    if (sendBtn && msgInput) {
        sendBtn.addEventListener("click", sendMessage);
        msgInput.addEventListener("keypress", (e) => {
            if (e.key === "Enter") sendMessage();
        });
    }

    if (suggestBtn && suggestInput) {
        suggestBtn.addEventListener("click", sendSuggest);
        suggestInput.addEventListener("keypress", (e) => {
            if (e.key === "Enter") sendSuggest();
        });
    }
}

document.addEventListener("DOMContentLoaded", () => {
    bindUI();
    loadMessages();
});

/* =========================
   REALTIME UPDATES
========================= */

client.channel("room1")
    .on(
        "postgres_changes",
        { event: "*", schema: "public", table: "message" },
        loadMessages
    )
    .subscribe();

</script>
