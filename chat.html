<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SultanChat</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        body { 
            margin: 0; padding: 40px; 
            font-family: Arial, sans-serif; 
            background-color: #f0f0f0; 
        }
        h1 { margin-top: 0; }
        #raw-messages p { 
            background: white; 
            padding: 10px; 
            border-bottom: 1px solid #eee; 
            margin: 0;
        }
    </style>
</head>
<body>

    <main class="main-content">
        <h1>SultanChat</h1>
        <p style="margin-bottom: 30px; color: #666;">Welcome to my alternative to Whatsapp: SultanChat.</p>

        <div id="raw-messages">Loading messages...</div>
    </main>

    <script>
        // Your specific credentials
        const SUPABASE_URL = "https://uhkoictzfseglnxbtdkw.supabase.co";
        const SUPABASE_KEY = "sb_publishable_-PUjgfccR3jtZcLLIyVz0w_ZL8966QQ";
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // 1. Get History (Old Messages)
        async function getHistory() {
            const { data, error } = await _supabase
                .from('messages')
                .select('content');
                
            if (error) {
                console.error("Error:", error);
                document.getElementById('raw-messages').innerText = "Error loading messages. Check RLS policies.";
                return;
            }

            if (data) {
                document.getElementById('raw-messages').innerHTML = ''; 
                data.forEach(msg => {
                    if(msg.content) {
                        document.getElementById('raw-messages').innerHTML += `<p>${msg.content}</p>`;
                    }
                });
            }
        }

        // 2. Realtime (New Messages)
        _supabase
          .channel('chat_channel')
          .on('postgres_changes', { 
              event: 'INSERT', 
              schema: 'public', 
              table: 'messages' 
          }, (payload) => {
              console.log("New message arrived!", payload.new);
              document.getElementById('raw-messages').innerHTML += `<p>${payload.new.content}</p>`;
          })
          .subscribe();

        // Start the check
        getHistory();
    </script>
</body>
</html>
