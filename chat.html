<script>
/* =========================
   SUPABASE CLIENT (PLACEHOLDER)
========================= */
const client = supabase.createClient(
    "YOUR_SUPABASE_URL_HERE",
    "YOUR_SUPABASE_KEY_HERE"
);

/* =========================
   UI ERROR DISPLAY CORE
========================= */

function showFatalError(title, details) {
    const chat = document.getElementById("chat");
    const status = document.getElementById("status");

    console.error("FATAL ERROR:", title, details);

    if (status) {
        status.style.background = "#FFE0E0";
        status.style.color = "#FF4444";
        status.textContent = "CRITICAL ENGINE BREAKDOWN";
    }

    if (chat) {
        chat.innerHTML = `
            <div style="
                color:#FF4444;
                padding:12px;
                font-family:monospace;
                font-size:13px;
                background:#FFEAEB;
                border-radius:8px;
                border-left:4px solid #FF4444;
                white-space:pre-wrap;
            ">
                <strong>${title}</strong>

                ${details}
            </div>
        `;
    }
}

/* =========================
   GLOBAL JS ERROR CATCHER
========================= */

window.addEventListener("error", function (event) {
    showFatalError(
        "JavaScript Runtime Error",
        `
Message: ${event.message}
File: ${event.filename}
Line: ${event.lineno} | Column: ${event.colno}
Stack: ${event.error?.stack || "No stack available"}
        `
    );
}, true);

/* =========================
   PROMISE ERROR CATCHER
========================= */

window.addEventListener("unhandledrejection", function (event) {
    showFatalError(
        "Unhandled Promise Rejection",
        `
Reason: ${event.reason}
        `
    );
});

/* =========================
   LOAD MESSAGES
========================= */

async function loadMessages() {
    const chat = document.getElementById("chat");
    const status = document.getElementById("status");

    try {
        const { data, error } = await client
            .from("wrong_table_name") // intentional crash works here
            .select("message")
            .not("message", "is", null)
            .neq("message", "")
            .order("id", { ascending: true });

        if (error) throw error;

        status.textContent = `● ONLINE - ${data.length} messages`;
        chat.innerHTML = "";

        if (data.length === 0) {
            chat.innerHTML = `
                <div style="color:#FF8A00; text-align:center; padding:80px 20px;">
                    No messages yet 👋
                </div>
            `;
            return;
        }

        for (const item of data) {
            const div = document.createElement("div");
            div.className = "msg";
            div.textContent = item.message;
            chat.appendChild(div);
        }

        chat.scrollTop = chat.scrollHeight;

    } catch (err) {

        // 🔥 REAL SUPABASE ERROR INTROSPECTION
        showFatalError(
            "Supabase Query Failure",
            `
Message: ${err.message || "Unknown"}
Code: ${err.code || "N/A"}
Details: ${err.details || "N/A"}
Hint: ${err.hint || "N/A"}
Full: ${JSON.stringify(err, null, 2)}
            `
        );
    }
}

/* =========================
   SEND MESSAGE
========================= */

async function sendMessage() {
    const input = document.getElementById("message-input");
    const btn = document.getElementById("send-btn");

    const text = input.value.trim();
    if (!text) return;

    btn.disabled = true;
    btn.textContent = "Sending...";

    try {
        const { error } = await client
            .from("message")
            .insert({ message: text });

        if (error) throw error;

        input.value = "";

    } catch (err) {
        alert("Failed to send message: " + err.message);
    } finally {
        btn.disabled = false;
        btn.textContent = "Send";
    }
}

/* =========================
   SEND SUGGESTION
========================= */

async function sendSuggest() {
    const input = document.getElementById("suggest-input");
    const btn = document.getElementById("suggest-btn");

    const text = input.value.trim();
    if (!text) return;

    btn.disabled = true;
    btn.textContent = "Sending...";

    try {
        const { error } = await client
            .from("message")
            .insert({ suggestion: text });

        if (error) throw error;

        input.value = "";

    } catch (err) {
        alert("Failed to send suggestion: " + err.message);
    } finally {
        btn.disabled = false;
        btn.textContent = "Suggest";
    }
}

/* =========================
   EVENT BINDING SAFETY
========================= */

function bindUI() {
    const sendBtn = document.getElementById("send-btn");
    const msgInput = document.getElementById("message-input");
    const suggestBtn = document.getElementById("suggest-btn");
    const suggestInput = document.getElementById("suggest-input");

    if (sendBtn && msgInput) {
        sendBtn.addEventListener("click", sendMessage);
        msgInput.addEventListener("keypress", (e) => {
            if (e.key === "Enter") sendMessage();
        });
    }

    if (suggestBtn && suggestInput) {
        suggestBtn.addEventListener("click", sendSuggest);
        suggestInput.addEventListener("keypress", (e) => {
            if (e.key === "Enter") sendSuggest();
        });
    }
}

document.addEventListener("DOMContentLoaded", () => {
    bindUI();
    loadMessages();
});

/* =========================
   REALTIME UPDATES
========================= */

client.channel("room1")
    .on(
        "postgres_changes",
        { event: "*", schema: "public", table: "message" },
        loadMessages
    )
    .subscribe();

</script>
