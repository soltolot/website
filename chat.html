<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SultanChat</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<link rel="manifest" href="/website/manifest.json">



<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const SUPABASE_URL = "https://vldkmlbfjzdrfzpeyver.supabase.co";
    const SUPABASE_KEY = "sb_publishable_3e7UaMtOS1nZawcvFHYGhA_-RSInVmg";
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function checkSession() {
        const { data: { session } } = await client.auth.getSession();
        if (!session) window.location.href = "login.html";
    }

async function loadUser() {
    const { data: { user }, error } = await client.auth.getUser();
    if (error || !user) window.location.href = "login.html";

    window.displayName = user.user_metadata.display_name;
    console.log("Logged in as:", window.displayName);
}

// Register service worker globally
if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/website/service-worker.js");
}

    

    checkSession();
    loadUser();
</script>

<style>
body {
    font-family: sans-serif;
    background: linear-gradient(135deg, #FFF8F0, #FFEDD5);
    color: #2C2C2C;
    margin: 0;
    padding: 20px;
    min-height: 100vh;
}

.container {
    max-width: 420px;
    width: 100%;
    margin: auto;
    background: white;
    padding: 25px;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(255, 140, 0, 0.15);
    border: 2px solid #FFBB66;
}


#color-picker {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 15px;
    justify-content: center;
}

.color-option {
    width: 26px;
    height: 26px;
    border-radius: 6px;
    cursor: pointer;
    border: 2px solid #fff;
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    transition: transform 0.15s ease;
}

.color-option:hover {
    transform: scale(1.15);
}



#chat {
    height: 380px;
    overflow-y: auto;
    background: #FFF9F0;
    padding: 15px;
    border-radius: 15px;
    border: 1px solid #FFDDAA;
    margin-bottom: 15px;
}


.msg {
    background: #FF6200;
    color: white;
    padding: 10px 12px;
    border-radius: 12px;
    margin-bottom: 8px;
    word-break: break-word;
    font-size: 15px;
}

.my-msg {
    background: #FF8A00;
}

.other-msg {
    background: #FF6200;
}

.status {
    padding: 10px;
    background: #FFEDD5;
    color: #E85D04;
    border-radius: 10px;
    text-align: center;
    font-family: monospace;
    font-weight: bold;
    font-size: 14px;
}

#send-area {
    display: flex;
    gap: 8px;
    margin-top: 10px;
}

#message-input,
#suggest-input {
    flex: 1;
    padding: 12px;
    background: #FFF4E0;
    border: 2px solid #FFBB66;
    border-radius: 10px;
    font-size: 15px;
    outline: none;
}

button {
    padding: 12px 14px;
    font-size: 14px;
    font-weight: bold;
    color: white;
    background: #E65100;
    border: none;
    border-radius: 10px;
    cursor: pointer;
}

button:hover {
    background: #DC4D00;
}

button:active {
    transform: scale(0.96);
}button:hover { background: #DC4D00; }
button:active { transform: scale(0.96); }
    
</style>
</head>

<body>
<div class="container">
    <h2>SultanChat</h2>

    <div id="color-picker">
    <div class="color-option" data-color="#C62828"></div>
    <div class="color-option" data-color="#D84315"></div>
    <div class="color-option" data-color="#E65100"></div>
    <div class="color-option" data-color="#FF6200"></div>
    <div class="color-option" data-color="#FF8A00"></div>

    <div class="color-option" data-color="#AD1457"></div>
    <div class="color-option" data-color="#8E24AA"></div>
    <div class="color-option" data-color="#5E35B1"></div>

    <div class="color-option" data-color="#3949AB"></div>
    <div class="color-option" data-color="#1E88E5"></div>
    <div class="color-option" data-color="#00897B"></div>
    <div class="color-option" data-color="#2E7D32"></div>
    <div class="color-option" data-color="#558B2F"></div>

    <div class="color-option" data-color="#6D4C41"></div>
    <div class="color-option" data-color="#546E7A"></div>
    </div>


    <button id="settings-btn" style="position:absolute; top:20px; right:20px; font-size:22px; background:none; border:none; cursor:pointer;">
    ⚙️
    </button>


    <div id="chat">Loading messages...</div>
    <div id="status" class="status">● CONNECTING…</div>

    <div id="send-area">
        <input type="text" id="message-input" placeholder="Type your message...">
        <button id="send-btn">Send</button>
    </div>

    <div id="send-area">
        <input type="text" id="suggest-input" placeholder="Type a suggestion...">
        <button id="suggest-btn">Suggest</button>
    </div>
</div>

<script>

document.getElementById("settings-btn").addEventListener("click", () => {
    alert("Settings coming soon!");
});

async function updateUserColor(newColor) {
    myColor = newColor;
    localStorage.setItem("myColor", newColor);

    await client
        .from("message")
        .update({
            message: null,
            suggestion: null,
            color: newColor
        })
        .eq("username", window.displayName);
}


let myColor = localStorage.getItem("myColor") || "#FF6200";

document.querySelectorAll(".color-option").forEach(option => {
    option.style.background = option.dataset.color;

    option.addEventListener("click", () => {
        updateUserColor(option.dataset.color);
    });
});


    
async function loadMessages() {
    const chat = document.getElementById("chat");
    const status = document.getElementById("status");

    try {
        const { data, error } = await client
            .from("message")
            .select("*")
            .order("id", { ascending: true });

        if (error){
            status.textContent = `● OFFLINE - ERROR`;
            throw error;
        }
        
        status.textContent = `● ONLINE - ${data.length} messages`;
        chat.innerHTML = "";

        if (!data.length) {
            chat.innerHTML = `<div style="color:#FF8A00; text-align:center; padding:80px 20px;">No messages yet. Be the first to type something 👋</div>`;
            return;
        }

data.forEach(item => {
    // Skip profile rows (message=null AND suggestion=null)
    if (!item.message && !item.suggestion) return;

    const div = document.createElement("div");
    div.className = "msg";

    // Use the sender's color
    div.style.background = item.color || "#FF6200";

    div.textContent = `${item.username}: ${item.message || item.suggestion}`;
    chat.appendChild(div);
});
});
        chat.scrollTop = chat.scrollHeight;

    } catch (err) {
        console.error(err);
    }
}

/* =========================
   SEND MESSAGE
========================= */
async function sendMessage() {
    const input = document.getElementById("message-input");
    const text = input.value.trim();
    if (!text) return;

    const btn = document.getElementById("send-btn");
    btn.disabled = true;
    btn.textContent = "Sending...";

    try {
        const { error } = await client
            .from("message")
            .insert({
                message: text,
                username: window.displayName
            });

        if (error) throw error;

        input.value = "";
    } catch (err) {
        console.error(err);
    } finally {
        btn.disabled = false;
        btn.textContent = "Send";
    }
}

/* =========================
   SEND SUGGESTION
========================= */
async function sendSuggest() {
    const input = document.getElementById("suggest-input");
    const text = input.value.trim();
    if (!text) return;

    const btn = document.getElementById("suggest-btn");
    btn.disabled = true;
    btn.textContent = "Sending...";

    try {
        const { error } = await client
            .from("message")
            .insert({
                suggestion: text,
                username: window.displayName
            });

        if (error) throw error;

        input.value = "";
    } catch (err) {
        console.error(err);
    } finally {
        btn.disabled = false;
        btn.textContent = "Suggest";
    }
}

/* =========================
   EVENT BINDING
========================= */
document.getElementById("send-btn").addEventListener("click", sendMessage);
document.getElementById("message-input").addEventListener("keypress", e => {
    if (e.key === "Enter") sendMessage();
});

document.getElementById("suggest-btn").addEventListener("click", sendSuggest);
document.getElementById("suggest-input").addEventListener("keypress", e => {
    if (e.key === "Enter") sendSuggest();
});

/* =========================
   REALTIME UPDATES
========================= */
client.channel("room1")
    .on("postgres_changes", { event: "*", schema: "public", table: "message" }, loadMessages)
    .subscribe();

loadMessages();
</script>

</body>
</html>
