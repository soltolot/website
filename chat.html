<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<script>
/* =========================
   SUPABASE CLIENT
========================= */
const client = supabase.createClient(
    "https://vldkmlbfjzdrfzpeyver.supabase.co",
    "sb_publishable_3e7UaMtOS1nZawcvFHYGhA_-RSInVmg"
);

/* =========================
   SAFE ERROR LOGGER
========================= */

function addErrorToChat(title, details) {
    const chat = document.getElementById("chat");

    const div = document.createElement("div");
    div.style.cssText = `
        color:#FF4444;
        padding:12px;
        font-family:monospace;
        font-size:13px;
        background:#FFEAEB;
        border-radius:8px;
        border-left:4px solid #FF4444;
        white-space:pre-wrap;
        margin:8px 0;
    `;
    div.textContent = `${title}\n\n${details}`;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

/* GLOBAL ERROR CATCHERS (SAFE) */
window.addEventListener("error", function (event) {
    if (!event.error) return;
    console.error(event.error);
    addErrorToChat("Runtime Error", event.message);
});

window.addEventListener("unhandledrejection", function (event) {
    console.error(event.reason);
    addErrorToChat("Promise Rejection", String(event.reason));
});

/* =========================
   LOAD MESSAGES
========================= */

async function loadMessages() {
    const chat = document.getElementById("chat");
    const status = document.getElementById("status");

    try {
        const { data, error } = await client
            .from("message")
            .select("*")
            .order("id", { ascending: true });

        if (error) throw error;

        status.textContent = `● ONLINE - ${data.length} messages`;
        chat.innerHTML = "";

        if (!data.length) {
            chat.innerHTML = `
                <div style="color:#FF8A00; text-align:center; padding:80px 20px;">
                    No messages yet 👋
                </div>
            `;
            return;
        }

        for (const item of data) {
            const div = document.createElement("div");
            div.className = "msg";
            div.textContent = item.message || item.suggestion || "(empty)";
            chat.appendChild(div);
        }

        chat.scrollTop = chat.scrollHeight;

    } catch (err) {
        addErrorToChat("Supabase Query Error", err.message);
    }
}

/* =========================
   SEND MESSAGE
========================= */

async function sendMessage() {
    const input = document.getElementById("message-input");
    const btn = document.getElementById("send-btn");

    const text = input.value.trim();
    if (!text) return;

    btn.disabled = true;
    btn.textContent = "Sending...";

    try {
        const { error } = await client
            .from("message")
            .insert({ message: text });

        if (error) throw error;

        input.value = "";

    } catch (err) {
        addErrorToChat("Send Message Error", err.message);
    } finally {
        btn.disabled = false;
        btn.textContent = "Send";
    }
}

/* =========================
   SEND SUGGESTION
========================= */

async function sendSuggest() {
    const input = document.getElementById("suggest-input");
    const btn = document.getElementById("suggest-btn");

    const text = input.value.trim();
    if (!text) return;

    btn.disabled = true;
    btn.textContent = "Sending...";

    try {
        const { error } = await client
            .from("message")
            .insert({ suggestion: text });

        if (error) throw error;

        input.value = "";

    } catch (err) {
        addErrorToChat("Send Suggestion Error", err.message);
    } finally {
        btn.disabled = false;
        btn.textContent = "Suggest";
    }
}

/* =========================
   EVENT BINDING
========================= */

function bindUI() {
    const sendBtn = document.getElementById("send-btn");
    const msgInput = document.getElementById("message-input");
    const suggestBtn = document.getElementById("suggest-btn");
    const suggestInput = document.getElementById("suggest-input");

    if (sendBtn && msgInput) {
        sendBtn.addEventListener("click", sendMessage);
        msgInput.addEventListener("keypress", (e) => {
            if (e.key === "Enter") sendMessage();
        });
    }

    if (suggestBtn && suggestInput) {
        suggestBtn.addEventListener("click", sendSuggest);
        suggestInput.addEventListener("keypress", (e) => {
            if (e.key === "Enter") sendSuggest();
        });
    }
}

document.addEventListener("DOMContentLoaded", () => {
    bindUI();
    loadMessages();
});

/* =========================
   REALTIME UPDATES
========================= */

client.channel("room1")
    .on(
        "postgres_changes",
        { event: "*", schema: "public", table: "message" },
        loadMessages
    )
    .subscribe();

</script>
