<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SultanChat - Live View</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; padding: 40px; background: #f0f0f0; }
        #chat-box { 
            background: white; 
            padding: 20px; 
            border-radius: 10px; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            max-width: 500px;
            margin: auto;
        }
        p { border-bottom: 1px solid #eee; padding: 10px 0; margin: 0; }
    </style>
</head>
<body>

    <div id="chat-box">
        <h2>SultanChat Live Feed</h2>
        <div id="messages">Loading...</div>
    </div>

    <script>
        const SUPABASE_URL = "https://uhkoictzfseglnxbtdkw.supabase.co";
        const SUPABASE_KEY = "sb_publishable_vV0deewV5046cJLsLmQyWg_cXzSaXuU";
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Load History
        async function loadMessages() {
            const { data, error } = await _supabase
                .from('messages')
                .select('content');

            if (error) {
                document.getElementById('messages').innerText = "Error: " + error.message;
                return;
            }

            const container = document.getElementById('messages');
            container.innerHTML = ''; // Clear "Loading..."
            
            if (data.length === 0) {
                container.innerText = "Connected. No messages found.";
            } else {
                data.forEach(msg => {
                    if (msg.content) container.innerHTML += `<p>${msg.content}</p>`;
                });
            }
        }

        // Listen for New Messages (Realtime)
        _supabase
            .channel('any')
            .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
                const container = document.getElementById('messages');
                if (container.innerText.includes("No messages")) container.innerHTML = '';
                container.innerHTML += `<p>${payload.new.content}</p>`;
            })
            .subscribe();

        loadMessages();
    </script>
</body>
</html>
