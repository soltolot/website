<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SultanChat - Final Fix</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; padding: 30px; background: #1a1a1a; color: white; }
        #chat { background: #2a2a2a; padding: 20px; border-radius: 10px; border: 1px solid #444; min-height: 100px; }
        p { border-bottom: 1px solid #333; padding: 10px; margin: 0; color: #00ff00; font-family: monospace; }
    </style>
</head>
<body>
    <h2>SultanChat Monitor</h2>
    <div id="chat">Connecting to the correct project...</div>

    <script>
        // FIXED: URL now matches your specific Key
        const URL = "https://mixxalydvognourxdtj.supabase.co";
        const KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1peHhhbHlkdm9nbG5vdXJ4ZHRqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc5NTY1NzYsImV4cCI6MjA5MzUzMjU3Nn0.P9_5dOXhJdvZr9KGl7YBwl1vsfDzBxq3JgRxlUqCxLc";
        
        const _supabase = supabase.createClient(URL, KEY);

        async function load() {
            const { data, error } = await _supabase
                .from('messages')
                .select('content');

            const display = document.getElementById('chat');

            if (error) {
                display.innerHTML = `<span style="color:red">Error: ${error.message}</span>`;
                return;
            }

            display.innerHTML = "";
            if (data && data.length > 0) {
                data.forEach(m => {
                    if(m.content) display.innerHTML += `<p>> ${m.content}</p>`;
                });
            } else {
                display.innerText = "Connected! Project matched. Table is empty.";
            }
        }

        // Listen for new rows
        _supabase.channel('room1').on('postgres_changes', {event:'INSERT', schema:'public', table:'messages'}, () => {
            load();
        }).subscribe();

        load();
    </script>
</body>
</html>
