<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SultanChat</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="icon" type="image/png" href="logo.png">
<link rel="manifest" href="manifest.json">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

:root {
    --my-msg-color: #FF6200;
}

body {
    font-family: sans-serif;
    background: linear-gradient(135deg, #FFF8F0, #FFEDD5);
    margin: 0;
    padding: 20px;
    min-height: 100vh;
}

/* YOUR ORIGINAL CARD STYLE */
.container {
    max-width: 420px;
    margin: auto;
    background: white;
    padding: 25px;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(255, 140, 0, 0.15);
    border: 2px solid #FFBB66;
}

/* CHAT */
#chat {
    height: 380px;
    overflow-y: auto;
    background: #FFF9F0;
    padding: 15px;
    border-radius: 15px;
    border: 1px solid #FFDDAA;
    margin-bottom: 10px;
}

.msg {
    color: white;
    padding: 10px 12px;
    border-radius: 12px;
    margin-bottom: 8px;
    word-break: break-word;
    font-size: 15px;
}

.my-msg {
    background: var(--my-msg-color);
}

/* STATUS */
.status {
    padding: 10px;
    background: #FFEDD5;
    color: #E85D04;
    border-radius: 10px;
    text-align: center;
    font-weight: bold;
    font-size: 14px;
    width: 100%;
    box-sizing: border-box;
}
    
/* INPUT AREA */
.send-area {
    display: flex;
    gap: 8px;
    margin-top: 10px;
}

input {
    flex: 1;
    padding: 12px;
    background: #FFF4E0;
    border: 2px solid #FFBB66;
    border-radius: 10px;
    font-size: 15px;
    outline: none;
}

button {
    padding: 12px 14px;
    font-size: 14px;
    font-weight: bold;
    color: white;
    background: #E65100;
    border: none;
    border-radius: 10px;
    cursor: pointer;
}

/* SETTINGS BUTTON */
#settings-btn {
    position: fixed;
    top: 15px;
    right: 15px;
    font-size: 22px;
    background: white;
    border: none;
    border-radius: 12px;
    padding: 8px 12px;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
}

/* SETTINGS MODAL */
#settings-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    display: none;
    justify-content: center;
    align-items: center;
}

#settings-window {
    background: white;
    padding: 20px;
    border-radius: 16px;
    width: 90%;
    max-width: 360px;
    text-align: center;
}

/* 15 COLOR PALETTE (RESTORED STYLE) */
.color-option {
    width: 28px;
    height: 28px;
    border-radius: 8px;
    display: inline-block;
    margin: 4px;
    cursor: pointer;
    border: 2px solid white;
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
}

</style>
</head>

<body>

<button id="settings-btn">⚙️</button>

<div class="container">

<h2>SultanChat</h2>

<div id="chat">Loading messages...</div>

<div id="status">● CONNECTING...</div>

<div class="send-area">
    <input id="message-input" placeholder="Type your message...">
    <button id="send-btn">Send</button>
</div>

</div>

<!-- SETTINGS -->
<div id="settings-overlay">
    <div id="settings-window">

        <h3>Choose Your Color</h3>

        <div id="colorPicker">

            <!-- FULL 15 COLORS RESTORED -->
            <div class="color-option" data-color="#C62828" style="background:#C62828"></div>
            <div class="color-option" data-color="#D84315" style="background:#D84315"></div>
            <div class="color-option" data-color="#E65100" style="background:#E65100"></div>
            <div class="color-option" data-color="#FF6200" style="background:#FF6200"></div>
            <div class="color-option" data-color="#FF8A00" style="background:#FF8A00"></div>

            <div class="color-option" data-color="#AD1457" style="background:#AD1457"></div>
            <div class="color-option" data-color="#8E24AA" style="background:#8E24AA"></div>
            <div class="color-option" data-color="#5E35B1" style="background:#5E35B1"></div>

            <div class="color-option" data-color="#3949AB" style="background:#3949AB"></div>
            <div class="color-option" data-color="#1E88E5" style="background:#1E88E5"></div>

            <div class="color-option" data-color="#00897B" style="background:#00897B"></div>
            <div class="color-option" data-color="#2E7D32" style="background:#2E7D32"></div>

            <div class="color-option" data-color="#558B2F" style="background:#558B2F"></div>
            <div class="color-option" data-color="#6D4C41" style="background:#6D4C41"></div>
            <div class="color-option" data-color="#546E7A" style="background:#546E7A"></div>

        </div>

        <button id="close-settings">Close</button>

    </div>
</div>

<script>

const SUPABASE_URL = "https://vldkmlbfjzdrfzpeyver.supabase.co";
const SUPABASE_KEY = "YOUR_SUPABASE_KEY";
const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let displayName = null;
let myColor = localStorage.getItem("myColor") || "#FF6200";
let lastRender = "";

document.documentElement.style.setProperty("--my-msg-color", myColor);

/* SAFE SESSION */
async function checkSession() {
    const { data: { session } } = await client.auth.getSession();
    if (!session) {
        window.location.href = "login.html";
        return false;
    }
    return true;
}

/* USER */
async function loadUser() {
    const { data: { user } } = await client.auth.getUser();
    if (!user) return false;

    displayName = user.user_metadata?.display_name || "Anonymous";
    return true;
}

/* PROFILE */
async function ensureProfile() {
    const { data } = await client
        .from("profiles")
        .select("*")
        .eq("username", displayName);

    if (!data.length) {
        await client.from("profiles").insert({
            username: displayName,
            color: myColor
        });
    }
}

/* FIXED: NO FLICKER + STABLE RENDER */
async function loadMessages() {

    const chat = document.getElementById("chat");
    const status = document.getElementById("status");

    try {

        const { data: messages, error: msgError } =
            await client
                .from("messages")
                .select("*")
                .order("id", { ascending: true });

        if (msgError) throw msgError;

        const { data: profiles, error: profileError } =
            await client
                .from("profiles")
                .select("*");

        if (profileError) throw profileError;

        const colors = {};

        profiles.forEach(p => {
            colors[p.username] = p.color;
        });

        status.textContent =
            `● ONLINE • ${messages.length} messages`;

        const key =
            JSON.stringify(messages);

        if (key === lastRender) return;

        lastRender = key;

        const scroll = chat.scrollTop;

        chat.replaceChildren();

        if (!messages.length) {

            chat.innerHTML = `
                <div style="
                    color:#FF8A00;
                    text-align:center;
                    padding:80px 20px;
                ">
                    No messages yet 👋
                </div>
            `;

            return;
        }

        messages.forEach(m => {

            const div =
                document.createElement("div");

            div.className = "msg";

            if (m.username === displayName) {

                div.classList.add("my-msg");

            } else {

                div.style.background =
                    colors[m.username] || "#FF6200";
            }

            div.textContent =
                `${m.username}: ${m.message}`;

            chat.appendChild(div);
        });

        chat.scrollTop = scroll;

    } catch (err) {

        console.error(err);

        status.textContent = "● ERROR";

        chat.innerHTML = `
            <div style="
                background:#B00020;
                color:white;
                padding:15px;
                border-radius:12px;
            ">
                ${err.message}
            </div>
        `;
    }
}
    
/* SETTINGS UI */
document.getElementById("settings-btn").onclick =
() => document.getElementById("settings-overlay").style.display = "flex";

document.getElementById("close-settings").onclick =
() => document.getElementById("settings-overlay").style.display = "none";

/* REALTIME */
client.channel("chat")
.on("postgres_changes", {
    event: "*",
    schema: "public",
    table: "messages"
}, () => loadMessages())
.subscribe();

/* START */
(async () => {
    if (!(await checkSession())) return;
    if (!(await loadUser())) return;

    await ensureProfile();
    await loadMessages();
})();

</script>

</body>
</html>
