<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SultanChat</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="icon" href="logo.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
    --my-msg-color: #FF6200;
}

body {
    font-family: sans-serif;
    background: linear-gradient(135deg, #FFF8F0, #FFEDD5);
    margin: 0;
    padding: 20px;
}

.container {
    max-width: 440px;
    margin: auto;
    background: white;
    padding: 22px;
    border-radius: 18px;
    box-shadow: 0 10px 30px rgba(255,140,0,0.12);
}

#chat {
    height: 400px;
    overflow-y: auto;
    background: #FFF9F0;
    padding: 14px;
    border-radius: 14px;
    border: 1px solid #FFD9A8;
}

/* SMOOTH MESSAGE APPEAR (REMOVES FLICKER FEEL) */
.msg {
    padding: 10px;
    border-radius: 12px;
    margin-bottom: 8px;
    background: #F5F5F5;
    word-break: break-word;
    opacity: 1;
}

.my-msg {
    background: var(--my-msg-color);
    color: white;
}

.status {
    margin-top: 10px;
    padding: 10px;
    background: #FFE8CC;
    border-radius: 10px;
    font-weight: bold;
    text-align: center;
}

.send-area {
    display: flex;
    gap: 8px;
    margin-top: 10px;
}

input {
    flex: 1;
    padding: 12px;
    border-radius: 10px;
    border: 2px solid #FFBB66;
    background: #FFF4E0;
}

button {
    padding: 12px;
    background: #E65100;
    color: white;
    border: none;
    border-radius: 10px;
}

/* SETTINGS */
#settings-btn {
    position: fixed;
    top: 14px;
    right: 14px;
    background: white;
    border: none;
    border-radius: 10px;
    padding: 10px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
}

#settings-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    display: none;
    justify-content: center;
    align-items: center;
}

#settings-window {
    background: white;
    padding: 20px;
    border-radius: 16px;
    width: 90%;
    max-width: 360px;
    text-align: center;
}

.color-option {
    width: 28px;
    height: 28px;
    border-radius: 8px;
    display: inline-block;
    margin: 4px;
    cursor: pointer;
}
</style>
</head>

<body>

<button id="settings-btn">⚙️</button>

<div class="container">

<h2>SultanChat</h2>

<div id="chat">Loading...</div>

<div id="status">● CONNECTING...</div>

<div class="send-area">
    <input id="message-input" placeholder="Type message...">
    <button id="send-btn">Send</button>
</div>

</div>

<div id="settings-overlay">
    <div id="settings-window">

        <h3>Colors</h3>

        <div id="colorPicker">
            <div class="color-option" data-color="#FF6200" style="background:#FF6200"></div>
            <div class="color-option" data-color="#3949AB" style="background:#3949AB"></div>
            <div class="color-option" data-color="#2E7D32" style="background:#2E7D32"></div>
            <div class="color-option" data-color="#8E24AA" style="background:#8E24AA"></div>
            <div class="color-option" data-color="#C62828" style="background:#C62828"></div>
        </div>

        <button id="close-settings">Close</button>
    </div>
</div>

<script>
const SUPABASE_URL = "https://vldkmlbfjzdrfzpeyver.supabase.co";
const SUPABASE_KEY = "YOUR_SUPABASE_KEY";
const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let displayName = null;
let myColor = localStorage.getItem("myColor") || "#FF6200";
let lastRenderKey = "";

document.documentElement.style.setProperty("--my-msg-color", myColor);

// --------------------
// SESSION
// --------------------
async function checkSession() {
    const { data: { session } } = await client.auth.getSession();
    if (!session) {
        window.location.href = "login.html";
        return false;
    }
    return true;
}

// --------------------
// USER
// --------------------
async function loadUser() {
    const { data: { user } } = await client.auth.getUser();
    if (!user) return false;

    displayName = user.user_metadata?.display_name || "Anonymous";
    return true;
}

// --------------------
// PROFILE
// --------------------
async function ensureProfile() {
    const { data } = await client
        .from("profiles")
        .select("*")
        .eq("username", displayName);

    if (!data.length) {
        await client.from("profiles").insert({
            username: displayName,
            color: myColor
        });
    }
}

// --------------------
// NO-FLICKER LOAD
// --------------------
async function loadMessages() {

    const chat = document.getElementById("chat");
    const status = document.getElementById("status");

    const { data: messages } = await client
        .from("messages")
        .select("*")
        .order("id", { ascending: true });

    const { data: profiles } = await client
        .from("profiles")
        .select("*");

    const colors = {};
    profiles.forEach(p => colors[p.username] = p.color);

    status.textContent = `● ONLINE • ${messages.length}`;

    // 🧠 KEY FIX: detect if UI actually changed
    const renderKey = JSON.stringify(messages);
    if (renderKey === lastRenderKey) return;
    lastRenderKey = renderKey;

    // 🧠 preserve scroll
    const scroll = chat.scrollTop;

    // ONLY replace if needed
    chat.replaceChildren();

    for (const m of messages) {
        const div = document.createElement("div");
        div.className = "msg";

        if (m.username === displayName) {
            div.classList.add("my-msg");
        } else {
            div.style.background = colors[m.username] || "#FF6200";
        }

        div.textContent = `${m.username}: ${m.message}`;
        chat.appendChild(div);
    }

    chat.scrollTop = scroll;
}

// --------------------
// SEND
// --------------------
async function sendMessage() {
    const input = document.getElementById("message-input");
    const text = input.value.trim();
    if (!text) return;

    await client.from("messages").insert({
        username: displayName,
        message: text
    });

    input.value = "";
}

// --------------------
// COLOR PICKER
// --------------------
document.querySelectorAll(".color-option").forEach(el => {
    el.onclick = async () => {
        myColor = el.dataset.color;
        localStorage.setItem("myColor", myColor);
        document.documentElement.style.setProperty("--my-msg-color", myColor);

        await client
            .from("profiles")
            .update({ color: myColor })
            .eq("username", displayName);

        loadMessages();
    };
});

// --------------------
// SETTINGS UI
// --------------------
document.getElementById("settings-btn").onclick =
() => document.getElementById("settings-overlay").style.display = "flex";

document.getElementById("close-settings").onclick =
() => document.getElementById("settings-overlay").style.display = "none";

// --------------------
// REALTIME
// --------------------
client.channel("chat")
.on("postgres_changes", {
    event: "*",
    schema: "public",
    table: "messages"
}, () => loadMessages())
.subscribe();

// --------------------
// START
// --------------------
(async () => {
    if (!(await checkSession())) return;
    if (!(await loadUser())) return;

    await ensureProfile();
    await loadMessages();
})();
</script>

</body>
</html>
