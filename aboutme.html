<!DOCTYPE html>
<html lang="en">
<head>
    <title>Dashboard | Profile</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary-blue: #0056b3;
            --bg-body: #f8f9fc;
            --text-main: #2d3436;
            --text-light: #636e72;
            --white: #ffffff;
            --border-color: #edf2f7;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            margin: 0;
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar Navigation */
        .sidebar {
            width: 260px;
            background: var(--white);
            border-right: 1px solid var(--border-color);
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
        }

        .logo {
            font-weight: 800;
            font-size: 20px;
            color: var(--primary-blue);
            margin-bottom: 40px;
            padding-left: 10px;
        }

        .nav-item {
            padding: 12px 15px;
            margin-bottom: 5px;
            border-radius: 8px;
            color: var(--text-light);
            text-decoration: none;
            font-weight: 500;
            transition: all 0.2s;
        }

        .nav-item.active {
            background: #eef5ff;
            color: var(--primary-blue);
        }

        /* Main Content Area */
        .main-content {
            flex: 1;
            padding: 40px 60px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        .profile-card {
            background: var(--white);
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.02);
            border: 1px solid var(--border-color);
            max-width: 800px;
        }

        .profile-header {
            display: flex;
            align-items: center;
            gap: 25px;
            margin-bottom: 30px;
        }

        .avatar {
            width: 80px;
            height: 80px;
            background: #f1f3f5;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
        }

        .user-info h2 { margin: 0; font-size: 24px; }
        .user-info p { margin: 5px 0 0; color: var(--text-light); }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 30px;
            border-top: 1px solid var(--border-color);
            padding-top: 30px;
        }

        .stat-box {
            text-align: center;
        }

        .stat-value {
            display: block;
            font-size: 20px;
            font-weight: 700;
            color: var(--primary-blue);
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .logout-btn {
            background: #fff;
            border: 1px solid #ff7675;
            color: #ff7675;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        .logout-btn:hover {
            background: #fff5f5;
            border-color: #d63031;
            color: #d63031;
        }
    </style>
</head>
<body>

    <nav class="sidebar">
        <div class="logo">APP_NAME</div>
        <a href="#" class="nav-item active">Profile</a>
        <a href="#" class="nav-item">Settings</a>
        <a href="#" class="nav-item">Messages</a>
    </nav>

    <main class="main-content">
        <div class="header">
            <h1>Account Overview</h1>
            <button class="logout-btn" onclick="logout()">Sign Out</button>
        </div>

        <div class="profile-card">
            <div class="profile-header">
                <div class="avatar">👤</div>
                <div class="user-info">
                    <h2 id="user-name">Welcome Back</h2>
                    <p id="user-email">Loading user profile...</p>
                </div>
            </div>

            <div class="stats-grid">
                <div class="stat-box">
                    <span class="stat-value">2026</span>
                    <span class="stat-label">Member Since</span>
                </div>
                <div class="stat-box">
                    <span class="stat-value">Active</span>
                    <span class="stat-label">Status</span>
                </div>
                <div class="stat-box">
                    <span class="stat-value">Level 1</span>
                    <span class="stat-label">Account Tier</span>
                </div>
            </div>
        </div>
    </main>

    <script>
        function logout() {
            window.location.href = "login.html";
        }
    </script>
</body>
</html>
