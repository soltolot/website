<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>About me</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            display: flex;
            min-height: 100vh;
        }


        .main-content {
            flex: 1;
            padding: 40px;
            border: 2px dashed #b2bec3;
        }

        .card {
            background: white;
            padding: 30px;
            border: 1px solid #ccc;
            border-radius: 8px;
            max-width: 600px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        h1 { margin-top: 0; }
        
        .info-row {
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }

        .btn {
            background-color: #ff7675;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            font-size: 16px;
            border-radius: 4px;
        }
        .btn:hover { background-color: #d63031; }

    </style>
</head>
<body>

    <main class="main-content">
        
        <h1>Dashboard</h1>
        <p style="margin-bottom: 30px; color: #666;">Welcome to my "About me' page.</p>

        <div class="card">
            <h2>My profile</h2>
            
            <div class="info-row">
                <strong>Name:</strong> Sultan Alawad
            </div>
            <div class="info-row">
                <strong>Email:</strong> sultan.awad.w@gmail.com
            </div>
            <div class="info-row">
                <strong>Status:</strong> <span style="color: green;">Active</span>
            </div>


    </main>

</body>
</html>
